<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Morning Brief">
<title>Morning Brief</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink:#1a1a1a; --paper:#f5f2ed; --cream:#ede9e2; --warm:#e8e2d8;
  --rule:rgba(26,26,26,0.12); --rule2:rgba(26,26,26,0.06);
  --accent:#b5602a; --accent2:#d4924e; --muted:#7a7570;
  --green:#2d6e45; --red:#c0392b; --surface:#fff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{height:100%;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;font-size:15px;-webkit-font-smoothing:antialiased;overflow:hidden;position:fixed;width:100%}
#app{height:100%;display:flex;flex-direction:column}

/* NAV */
.nav{background:var(--ink);flex-shrink:0;padding-top:max(env(safe-area-inset-top,44px),44px)}
.nav-inner{padding:12px 20px 0;display:flex;justify-content:space-between;align-items:flex-end}
.nav-date{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:4px}
.nav-title{font-family:'Playfair Display',serif;font-size:26px;color:#fff;font-weight:400;line-height:1}
.nav-title em{font-style:italic;color:var(--accent2)}
.nav-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.btn-refresh{background:none;border:1px solid rgba(255,255,255,.25);border-radius:4px;padding:7px 13px;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.7);cursor:pointer;font-family:'Inter',sans-serif}
.btn-refresh:disabled{opacity:.3}
.nav-ts{font-size:10px;color:rgba(255,255,255,.25)}

/* TABS */
.ctabs{background:var(--ink);border-bottom:1px solid rgba(255,255,255,.08);display:flex;overflow-x:auto;padding:0 20px;margin-top:10px;scrollbar-width:none;flex-shrink:0}
.ctabs::-webkit-scrollbar{display:none}
.ctab{flex-shrink:0;padding:9px 13px 11px;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.3);border:none;border-bottom:2px solid transparent;background:none;cursor:pointer;white-space:nowrap;font-family:'Inter',sans-serif}
.ctab.on{color:#fff;border-bottom-color:var(--accent2)}

/* CONTENT */
.cnt{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:max(env(safe-area-inset-bottom,16px),32px)}

/* SKELETON */
.sk{background:linear-gradient(90deg,var(--cream) 25%,var(--warm) 50%,var(--cream) 75%);background-size:200% 100%;animation:sh 1.3s infinite;border-radius:2px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk-item{border-bottom:1px solid var(--rule2);padding:16px 20px}

/* TYPOGRAPHY */
.sec-rule{font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--rule);padding:16px 20px 8px}
.sum-block{padding:18px 20px 0}
.sum-text{font-family:'Playfair Display',serif;font-size:16px;line-height:1.8;color:#2a2520;border-bottom:1px solid var(--rule);padding-bottom:16px}
.pt-item{border-bottom:1px solid var(--rule2);padding:13px 20px}
.pt-label{font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.pt-title{font-family:'Playfair Display',serif;font-size:14px;color:var(--ink);margin-bottom:4px}
.pt-body{font-size:12px;color:var(--muted);line-height:1.65}
.ts-line{text-align:center;font-size:10px;color:rgba(26,26,26,.2);letter-spacing:.08em;padding:14px 20px}
.empty-note{padding:32px 20px;text-align:center;font-size:13px;color:var(--muted)}
.alert-bar{margin:14px 20px 0;background:#fff3e0;border-left:3px solid var(--accent);padding:10px 14px;font-size:12px;color:#7a3a10;line-height:1.6;border-radius:0 4px 4px 0}

/* QUICK LINKS */
.quick-links{display:flex;gap:10px;padding:16px 20px 0}
.qlink{flex:1;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:14px 12px;text-align:center;text-decoration:none;color:inherit;display:flex;flex-direction:column;align-items:center;gap:6px}
.qlink:active{background:var(--cream)}
.qlink-icon{font-size:22px;line-height:1}
.qlink-label{font-size:11px;font-weight:600;color:var(--ink)}
.qlink-sub{font-size:9px;color:var(--muted)}

/* ARTICLES */
.art-rule{font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--rule);padding:16px 20px 8px}
.art{display:block;color:inherit;text-decoration:none;border-bottom:1px solid var(--rule2);padding:13px 20px;position:relative}
a.art:active{background:var(--cream)}
.art-meta{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.badge{font-size:9px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;padding:2px 8px;border-radius:2px}
.b-ec{background:rgba(181,96,42,.12);color:#7a3a10}
.b-fi{background:rgba(20,60,150,.1);color:#1a3a80}
.b-bfm{background:rgba(30,100,200,.1);color:#1a50a0}
.b-re{background:rgba(200,60,30,.1);color:#a03020}
.b-lm{background:rgba(0,0,0,.08);color:#444}
.b-ch{background:rgba(40,120,60,.1);color:#206030}
.b-droit{background:rgba(100,40,140,.1);color:#5a2080}
.b-vat{background:rgba(180,150,40,.12);color:#7a6010}
.b-def{background:rgba(0,0,0,.06);color:#555}
.art-time{font-size:10px;color:var(--muted)}
.art-title{font-family:'Playfair Display',serif;font-size:15px;line-height:1.45;color:var(--ink);margin-bottom:5px}
.art-body{font-size:12px;color:var(--muted);line-height:1.65}
.art-cta{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-top:7px;font-weight:500}
.fav-btn{position:absolute;top:13px;right:16px;background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted);padding:2px;line-height:1}
.fav-btn.saved{color:#e8a020}

/* METRICS */
.met-sec{padding:14px 20px 0}
.met-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:4px}
.met{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:12px 13px}
.met-label{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;display:flex;align-items:center;justify-content:space-between}
.met-label span{font-size:8px;color:var(--accent)}
.met-row{display:flex;justify-content:space-between;align-items:baseline}
.met-val{font-family:'Playfair Display',serif;font-size:18px;font-weight:600;color:var(--ink)}
.met-chg{font-size:12px;font-weight:500}
.up{color:var(--green)}.dn{color:var(--red)}.fl{color:var(--muted)}
.met-live{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--green);margin-left:4px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* OAT CURVE */
.curve-wrap{padding:16px 20px 0}
.curve-box{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:16px;margin-bottom:12px}
.curve-date{font-size:10px;color:var(--muted);text-align:right;margin-bottom:8px}
.curve-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.curve-item{text-align:center}
.curve-mat{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.curve-rate{font-family:'Playfair Display',serif;font-size:15px;font-weight:600;color:var(--ink)}
.curve-diff{font-size:9px;color:var(--muted)}

/* AGENDA */
.agenda-day{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);padding:14px 20px 6px;background:var(--paper)}
.agenda-empty{padding:16px 20px;font-size:13px;color:var(--muted);font-style:italic}
.agenda-setup-label{font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.agenda-setup-input{width:100%;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:12px 14px;color:var(--ink);font-size:14px;font-family:'Inter',sans-serif;outline:none;margin-bottom:14px;-webkit-appearance:none}
.agenda-setup-input:focus{border-color:var(--accent)}
.agenda-setup-btn{background:var(--ink);color:#fff;border:none;border-radius:6px;padding:12px 24px;font-size:13px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer}
.cal-item{border-bottom:1px solid var(--rule2);padding:12px 20px;display:flex;gap:12px;align-items:flex-start}
.cal-day{font-size:10px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.cal-time{font-size:11px;color:var(--muted)}
.cal-event-title{font-family:'Playfair Display',serif;font-size:14px;color:var(--ink);margin-bottom:3px}
.cal-loc{font-size:11px;color:var(--muted)}
.imp-high{border-left:3px solid var(--red)}
.imp-med{border-left:3px solid var(--accent)}
.cal-badge{display:inline-block;font-size:8px;padding:1px 5px;border-radius:2px;margin-right:4px;font-weight:600;letter-spacing:.05em}
.cb-fr{background:rgba(181,96,42,.12);color:#7a3a10}
.cb-eu{background:rgba(45,110,69,.1);color:#1e5232}
.cb-de{background:rgba(0,0,0,.07);color:#444}

/* CURIOSITE */
.curio-block{padding:16px 20px 0}
.curio-card{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:16px;margin-bottom:10px}
.curio-label{font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.curio-chiffre{font-family:'Playfair Display',serif;font-size:32px;font-weight:600;color:var(--ink);margin-bottom:6px}
.curio-text{font-size:13px;color:var(--muted);line-height:1.65}
.curio-source{font-size:10px;color:var(--muted);margin-top:6px;font-style:italic}

/* RESPONSIVE PC */
@media(min-width:768px){
  body{overflow:auto;position:static}
  #app{height:auto;min-height:100vh}
  .nav{position:sticky;top:0;z-index:100}
  .cnt{overflow:visible;padding-bottom:40px}
  .met-grid{grid-template-columns:repeat(3,1fr)}
  a.art:hover{background:var(--cream)}
  .qlink:hover{background:var(--cream)}
}
@media(min-width:1100px){.met-grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div id="app">
  <div class="nav">
    <div class="nav-inner">
      <div>
        <div class="nav-date" id="hdate"></div>
        <div class="nav-title">Morning <em>Brief</em></div>
      </div>
      <div class="nav-right">
        <button class="btn-refresh" id="rbtn" onclick="loadBriefing()">Actualiser</button>
        <div class="nav-ts" id="hts"></div>
      </div>
    </div>
    <div class="ctabs">
      <button class="ctab on" onclick="sw(this,'s')">Synthese</button>
      <button class="ctab" onclick="sw(this,'m')">Marches</button>
      <button class="ctab" onclick="sw(this,'e')">Entreprises</button>
      <button class="ctab" onclick="sw(this,'a')">M&amp;A</button>
      <button class="ctab" onclick="sw(this,'k')">Macro</button>
      <button class="ctab" onclick="sw(this,'p')">Politique</button>
      <button class="ctab" onclick="sw(this,'x')">Taux</button>
      <button class="ctab" onclick="sw(this,'d')">Droit</button>
      <button class="ctab" onclick="sw(this,'v')">Eglise</button>
      <button class="ctab" onclick="sw(this,'g')">Agenda eco</button>
      <button class="ctab" onclick="sw(this,'c')">Curiosite</button>
      <button class="ctab" onclick="sw(this,'f')">Favoris</button>
      <button class="ctab" onclick="sw(this,'cal')">Mon Agenda</button>
    </div>
  </div>
  <div class="cnt" id="cnt"></div>
</div>

<script>
var B = null;
var tab = 's';
var favorites = JSON.parse(localStorage.getItem('mb_favorites') || '[]');
var gcalApiKey = localStorage.getItem('mb_gcal_key') || '';
var gcalId = localStorage.getItem('mb_gcal_id') || '';
var gcalId2 = localStorage.getItem('mb_gcal_id2') || '';
var agendaEvents = null;
var liveMetrics = {};

var dn = new Date();
var DAYS=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
var MONTHS=['janvier','fevrier','mars','avril','mai','juin','juillet','aout','septembre','octobre','novembre','decembre'];
document.getElementById('hdate').textContent = DAYS[dn.getDay()]+' '+dn.getDate()+' '+MONTHS[dn.getMonth()]+' '+dn.getFullYear();

function sw(el, t) {
  document.querySelectorAll('.ctab').forEach(function(x){x.classList.remove('on')});
  el.classList.add('on'); tab = t;
  B ? renderBrief(t) : showSkel();
}

function showSkel() {
  var h='';
  for(var i=0;i<5;i++) h+='<div class="sk-item"><div class="sk" style="height:10px;width:55px;border-radius:20px;margin-bottom:10px"></div><div class="sk" style="height:15px;width:88%;margin-bottom:8px"></div><div class="sk" style="height:15px;width:65%;margin-bottom:10px"></div><div class="sk" style="height:12px;width:100%;margin-bottom:5px"></div><div class="sk" style="height:12px;width:72%"></div></div>';
  document.getElementById('cnt').innerHTML = h;
}

function badge(src) {
  var s=(src||'').toLowerCase();
  if(s.indexOf('echos')>=0) return '<span class="badge b-ec">Les Echos</span>';
  if(s.indexOf('figaro')>=0) return '<span class="badge b-fi">Le Figaro</span>';
  if(s.indexOf('bfm')>=0) return '<span class="badge b-bfm">BFM</span>';
  if(s.indexOf('reuters')>=0) return '<span class="badge b-re">Reuters</span>';
  if(s.indexOf('monde')>=0) return '<span class="badge b-lm">Le Monde</span>';
  if(s.indexOf('challenges')>=0) return '<span class="badge b-ch">Challenges</span>';
  if(s.indexOf('legifrance')>=0) return '<span class="badge b-droit">Legifrance</span>';
  if(s.indexOf('dalloz')>=0) return '<span class="badge b-droit">Dalloz</span>';
  if(s.indexOf('vatican')>=0) return '<span class="badge b-vat">Vatican News</span>';
  return '<span class="badge b-def">'+(src||'Web')+'</span>';
}

function isFav(url) { return favorites.some(function(f){return f.url===url;}); }
function toggleFav(btn) {
  if (window.event) { window.event.preventDefault(); window.event.stopPropagation(); }
  var url = btn.getAttribute('data-url');
  var titre = btn.getAttribute('data-titre');
  var source = btn.getAttribute('data-source');
  var idx=favorites.findIndex(function(f){return f.url===url;});
  if(idx>=0) favorites.splice(idx,1);
  else favorites.unshift({url:url,titre:titre,source:source,savedAt:new Date().toISOString()});
  localStorage.setItem('mb_favorites', JSON.stringify(favorites));
  renderBrief(tab);
}

function artCard(a) {
  var url=(a.url&&a.url.indexOf('http')===0)?a.url:null;
  var fav=url?isFav(url):false;
  var tag=url?'a':'div';
  var attr=url?' href="'+url+'" target="_blank"':'';
  var cta=url?'<div class="art-cta">Lire -></div>':'';
  var body=a.resume?'<div class="art-body">'+a.resume+'</div>':'';
  var titleEsc=(a.titre||'').replace(/'/g,"\\'");
  var sourceEsc=(a.source||'').replace(/'/g,"\\'");
  var urlEsc=url?url.replace(/'/g,"\\'"):'';
  var favBtn=url?('<button class="fav-btn'+(fav?' saved':'')+'" onclick="toggleFav(this)" data-url="'+urlEsc+'" data-titre="'+titleEsc+'" data-source="'+sourceEsc+'">'+(fav?'&#9733;':'&#9734;')+'</button>'):'';
  return '<'+tag+' class="art"'+attr+'>'+favBtn+'<div class="art-meta">'+badge(a.source)+'<span class="art-time">'+(a.heure||'')+'</span></div><div class="art-title">'+(a.titre||'')+'</div>'+body+cta+'</'+tag+'>';
}
function artList(key) {
  var list=B[key]&&B[key].articles?B[key].articles:[];
  if(!list.length) return '<div class="empty-note">Aucun article disponible</div>';
  return list.map(artCard).join('');
}

var TICKERS = {
  'CAC 40':       {sym:'^FCHI',      fmt: function(v){return Math.round(v).toLocaleString('fr-FR');}},
  'Eurostoxx 50': {sym:'^STOXX50E',  fmt: function(v){return Math.round(v).toLocaleString('fr-FR');}},
  'S&P 500':      {sym:'^GSPC',      fmt: function(v){return Math.round(v).toLocaleString('fr-FR');}},
  'Nasdaq':       {sym:'^IXIC',      fmt: function(v){return Math.round(v).toLocaleString('fr-FR');}},
  'EUR/USD':      {sym:'EURUSD=X',   fmt: function(v){return v.toFixed(4);}},
  'Brent':        {sym:'BZ=F',       fmt: function(v){return v.toFixed(1)+' $';}},
  'Or':           {sym:'GC=F',       fmt: function(v){return Math.round(v).toLocaleString('fr-FR')+' $';}}
};

function fetchLiveMetric(label) {
  var cfg = TICKERS[label];
  if (!cfg) return Promise.resolve();
  var url = 'https://query1.finance.yahoo.com/v7/finance/quote?symbols='+encodeURIComponent(cfg.sym)+'&fields=regularMarketPrice,regularMarketChangePercent';
  return fetch(url, {headers:{'User-Agent':'Mozilla/5.0'}})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(data){
      var res = (data.quoteResponse && data.quoteResponse.result) || [];
      if (res.length) {
        var q = res[0];
        var pct = q.regularMarketChangePercent || 0;
        var dir = pct > 0.05 ? 'up' : pct < -0.05 ? 'down' : 'flat';
        liveMetrics[label] = {value: cfg.fmt(q.regularMarketPrice), change: (pct>0?'+':'')+pct.toFixed(2)+'%', dir: dir};
        if (tab === 'm') renderBrief('m');
      }
    })
    .catch(function(e){ console.log('Live '+label+':', e.message); });
}
function fetchAllLiveMetrics() {
  return Promise.all(Object.keys(TICKERS).map(fetchLiveMetric));
}

function metCard(label) {
  var live = liveMetrics[label];
  var val = live ? live.value : '<span style="font-size:12px;color:var(--muted)">...</span>';
  var chg = live ? live.change : '';
  var dir = live ? (live.dir==='up'?'up':live.dir==='down'?'dn':'fl') : 'fl';
  var pip = live ? '<span class="met-live"></span>' : '';
  return '<div class="met"><div class="met-label">'+label+pip+'</div><div class="met-row"><div class="met-val">'+val+'</div>'+(chg?'<div class="met-chg '+dir+'">'+chg+'</div>':'')+'</div></div>';
}

function renderOat(curve) {
  if(!curve||!curve.length) return '';
  var valid=curve.filter(function(p){return p.rate!==null;});
  var svg='';
  if(valid.length>=2) {
    var rates=valid.map(function(p){return p.rate;}), minR=Math.min.apply(null,rates)-0.1, maxR=Math.max.apply(null,rates)+0.1;
    var W=300,H=80,pad=12;
    var pts=valid.map(function(p,i){
      var x=pad+(i/(valid.length-1))*(W-pad*2);
      var y=H-pad-((p.rate-minR)/(maxR-minR))*(H-pad*2);
      return x.toFixed(1)+','+y.toFixed(1);
    }).join(' ');
    svg='<svg viewBox="0 0 300 80" style="width:100%;height:80px"><polyline points="'+pts+'" fill="none" stroke="#b5602a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'+
      valid.map(function(p,i){var x=pad+(i/(valid.length-1))*(W-pad*2);var y=H-pad-((p.rate-minR)/(maxR-minR))*(H-pad*2);return '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="3" fill="#b5602a"/>';}).join('')+'</svg>';
  }
  var curveDate=''; curve.forEach(function(p){if(p.date&&!curveDate)curveDate=p.date;});
  var items=curve.map(function(p){
    var arrow=p.trend==='up'?'<span style="color:var(--red)">&#9650;</span>':p.trend==='down'?'<span style="color:var(--green)">&#9660;</span>':'<span style="color:var(--muted)">&#9644;</span>';
    var diff=p.diff!==null&&p.diff!==undefined?((p.diff>0?'+':'')+p.diff.toFixed(3)):'';
    return '<div class="curve-item"><div class="curve-mat">'+p.maturity+'</div><div class="curve-rate">'+(p.rate!==null?p.rate.toFixed(2)+'%':'-')+'</div><div>'+arrow+'</div><div class="curve-diff">'+diff+'</div></div>';
  }).join('');
  return '<div class="curve-wrap"><div class="sec-rule" style="padding:0 0 8px;margin-bottom:12px">Courbe OAT France</div><div class="curve-box">'+(curveDate?'<div class="curve-date">BCE: '+curveDate+'</div>':'')+svg+'<div class="curve-grid">'+items+'</div></div></div>';
}

var QUICK_LINKS = [
  {icon:'\\ud83d\\udcfb', label:'Europe 1', sub:'Direct / Flash', url:'https://www.europe1.fr/direct-radio'},
  {icon:'\\u271d\\ufe0f', label:'Vatican News', sub:'Flash info', url:'https://www.vaticannews.va/fr/derniere-heure.html'}
];
function renderQuickLinks() {
  return '<div class="quick-links">' + QUICK_LINKS.map(function(q){
    return '<a class="qlink" href="'+q.url+'" target="_blank"><div class="qlink-icon">'+q.icon+'</div><div class="qlink-label">'+q.label+'</div><div class="qlink-sub">'+q.sub+'</div></a>';
  }).join('') + '</div>';
}

function renderBrief(t) {
  var el=document.getElementById('cnt');
  if(!B){showSkel();return;}
  if(t==='s'){
    var pts='';
    (B.synthese&&B.synthese.points?B.synthese.points:[]).forEach(function(p){
      var parts=(p.titre||'').split(' - ');
      var lbl=parts.length>1?parts[0].trim():'';
      var rest=parts.length>1?parts.slice(1).join(' - ').trim():p.titre;
      pts+='<div class="pt-item"><div class="pt-label">'+lbl+'</div><div class="pt-title">'+rest+'</div><div class="pt-body">'+(p.detail||'')+'</div></div>';
    });
    el.innerHTML=(B.alerte?'<div class="alert-bar">'+B.alerte+'</div>':'')+
      renderQuickLinks()+
      '<div class="sum-block"><div class="sum-text">'+(B.synthese&&B.synthese.resume?B.synthese.resume:'')+'</div></div>'+
      '<div class="sec-rule">Points cles</div>'+pts+
      '<div class="ts-line">Genere le '+(B.timestamp||'')+'</div>';
  }
  else if(t==='m'){
    var labels = Object.keys(TICKERS);
    el.innerHTML='<div class="met-sec"><div class="sec-rule" style="padding:0 0 8px;margin-bottom:8px">Indices et taux en temps reel</div><div class="met-grid">'+labels.map(metCard).join('')+'</div></div><div class="art-rule">Actualites marches</div>'+artList('marches');
  }
  else if(t==='x'){
    el.innerHTML=renderOat(B.taux&&B.taux.courbe?B.taux.courbe:[])+'<div class="art-rule">Actualites taux</div>'+artList('taux');
  }
  else if(t==='d'){
    el.innerHTML='<div class="art-rule">Droit des affaires - Legifrance et Dalloz</div>'+artList('droit');
  }
  else if(t==='v'){
    el.innerHTML='<div class="art-rule">Actualite de l Eglise - Vatican News</div>'+artList('vatican');
  }
  else if(t==='g'){
    var events=B.calendrier||[];
    if(!events.length){el.innerHTML='<div class="empty-note">Aucun evenement cette semaine</div>';return;}
    var JOURS=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
    var MOIS2=['jan','fev','mar','avr','mai','jun','jul','aou','sep','oct','nov','dec'];
    var h='<div class="sec-rule">Agenda economique - semaine en cours</div>';
    events.forEach(function(e){
      var imp=e.importance>=3?'imp-high':'imp-med';
      var pb=e.pays==='FR'?'<span class="cal-badge cb-fr">FR</span>':e.pays==='EU'?'<span class="cal-badge cb-eu">EU</span>':'<span class="cal-badge cb-de">'+e.pays+'</span>';
      var dt=e.date?new Date(e.date):null;
      var ds=dt?JOURS[dt.getDay()]+' '+dt.getDate()+' '+MOIS2[dt.getMonth()]:e.date;
      var meta='';
      if(e.consensus) meta+='Consensus: '+e.consensus;
      if(e.previous) meta+=(meta?' | ':'')+'Prec: '+e.previous;
      if(e.actual) meta+=(meta?' | ':'')+'<strong>Publie: '+e.actual+'</strong>';
      h+='<div class="cal-item '+imp+'"><div style="min-width:60px;flex-shrink:0"><div class="cal-day">'+ds+'</div><div class="cal-time">'+(e.time||'')+'</div></div><div><div class="cal-event-title">'+pb+(e.event||'')+'</div>'+(meta?'<div class="cal-loc">'+meta+'</div>':'')+'</div></div>';
    });
    el.innerHTML=h;
  }
  else if(t==='c'){
    var cur=B.curiosite||{};
    var chiffre=cur.chiffre_du_jour||{};
    var ephem=cur.ephemeride||{};
    var graphiq=cur.graphique_semaine||{};
    var h='<div class="curio-block">';
    if(chiffre.chiffre) h+='<div class="curio-card"><div class="curio-label">Chiffre du jour</div><div class="curio-chiffre">'+chiffre.chiffre+'</div><div class="curio-text">'+(chiffre.contexte||'')+'</div>'+(chiffre.source?'<div class="curio-source">'+chiffre.source+'</div>':'')+'</div>';
    if(ephem.evenement) h+='<div class="curio-card"><div class="curio-label">Ephemeride economique</div><div class="pt-title" style="margin-bottom:6px">'+(ephem.evenement||'')+'</div><div class="curio-text">'+(ephem.impact||'')+'</div></div>';
    if(graphiq.titre){
      var donnees=graphiq.donnees||[];
      var svgG='';
      if(donnees.length>=2){
        var vals=donnees.map(function(d){return parseFloat(d.valeur)||0;});
        var minV=Math.min.apply(null,vals),maxV=Math.max.apply(null,vals),range=maxV-minV||1;
        var gpts=donnees.map(function(d,i){var x=10+(i/(donnees.length-1))*260;var y=70-((parseFloat(d.valeur)-minV)/range)*55;return x.toFixed(1)+','+y.toFixed(1);}).join(' ');
        svgG='<svg viewBox="0 0 280 80" style="width:100%;height:80px;margin-bottom:8px"><polyline points="'+gpts+'" fill="none" stroke="#b5602a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        svgG+='<div style="display:flex;gap:4px">'+donnees.map(function(d){return '<div style="text-align:center;flex:1"><div style="font-size:9px;color:var(--muted)">'+d.label+'</div><div style="font-size:11px;font-weight:600">'+d.valeur+'</div></div>';}).join('')+'</div>';
      }
      h+='<div class="curio-card"><div class="curio-label">Graphique de la semaine</div><div class="pt-title" style="margin-bottom:8px">'+graphiq.titre+'</div>'+svgG+'<div class="curio-text" style="margin-top:10px">'+(graphiq.description||'')+'</div></div>';
    }
    h+='</div>';
    el.innerHTML=h||'<div class="empty-note">Pas de contenu</div>';
  }
  else if(t==='f'){
    if(!favorites.length){el.innerHTML='<div class="empty-note">Pas encore de favoris. Appuie sur etoile d un article.</div>';return;}
    el.innerHTML='<div class="sec-rule">Articles sauvegardes ('+favorites.length+')</div>'+favorites.map(artCard).join('');
  }
  else if(t==='cal'){
    renderCalendar(el);
  }
  else{
    var cfg={e:{key:'entreprises',label:'Resultats et vie des entreprises'},a:{key:'ma',label:'Fusions, acquisitions et PE'},k:{key:'macro',label:'Macroeconomie France et Europe'},p:{key:'politique',label:'Politique economique et geopolitique'}};
    var c=cfg[t];
    el.innerHTML='<div class="art-rule">'+c.label+'</div>'+artList(c.key);
  }
}

function renderCalendar(el) {
  if(!gcalApiKey||!gcalId){
    el.innerHTML='<div style="padding:20px"><div class="sec-rule" style="padding:0 0 8px;margin-bottom:16px">Configuration Google Calendar</div>'+
      '<div class="agenda-setup-label">Cle API Google</div>'+
      '<input class="agenda-setup-input" type="password" id="gcal-key" placeholder="AIza..." autocomplete="off">'+
      '<div class="agenda-setup-label">Agenda 1</div>'+
      '<input class="agenda-setup-input" id="gcal-id" placeholder="votre@gmail.com" autocomplete="off">'+
      '<div class="agenda-setup-label">Agenda 2 (optionnel)</div>'+
      '<input class="agenda-setup-input" id="gcal-id2" placeholder="pro@gmail.com" autocomplete="off">'+
      '<div style="font-size:11px;color:var(--muted);line-height:1.65;margin-bottom:16px">Les deux agendas seront fusionnes. Rendez le calendrier public dans les parametres Google Calendar.</div>'+
      '<button class="agenda-setup-btn" onclick="saveGcalConfig()">Enregistrer</button></div>';
    return;
  }
  if(agendaEvents!==null){renderAgendaEvents(el,agendaEvents);}
  else{el.innerHTML='<div class="empty-note">Chargement...</div>';loadAgenda();}
}
function saveGcalConfig() {
  var k=document.getElementById('gcal-key'),i=document.getElementById('gcal-id'),i2=document.getElementById('gcal-id2');
  if(!k||!i) return;
  gcalApiKey=k.value.trim(); gcalId=i.value.trim(); gcalId2=i2?i2.value.trim():'';
  localStorage.setItem('mb_gcal_key',gcalApiKey); localStorage.setItem('mb_gcal_id',gcalId); localStorage.setItem('mb_gcal_id2',gcalId2);
  agendaEvents=null; renderBrief('cal');
}
function resetGcalConfig(){
  gcalApiKey='';gcalId='';gcalId2='';
  ['mb_gcal_key','mb_gcal_id','mb_gcal_id2'].forEach(function(k){localStorage.removeItem(k);});
  agendaEvents=null; renderBrief('cal');
}
function fetchCalEvents(calId){
  var now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate()),end=new Date(today.getTime()+2*24*60*60*1000);
  var url='https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(calId)+'/events?key='+gcalApiKey+'&timeMin='+encodeURIComponent(today.toISOString())+'&timeMax='+encodeURIComponent(end.toISOString())+'&singleEvents=true&orderBy=startTime&maxResults=50';
  return fetch(url).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(function(d){return d.items||[];});
}
function loadAgenda(){
  if(!gcalApiKey||!gcalId) return;
  var promises=[fetchCalEvents(gcalId)];
  if(gcalId2) promises.push(fetchCalEvents(gcalId2));
  Promise.all(promises).then(function(results){
    var all=[];results.forEach(function(items){all=all.concat(items);});
    all.sort(function(a,b){var ta=a.start.dateTime||a.start.date,tb=b.start.dateTime||b.start.date;return ta<tb?-1:ta>tb?1:0;});
    agendaEvents=all;
    if(tab==='cal') renderAgendaEvents(document.getElementById('cnt'),agendaEvents);
  }).catch(function(e){
    agendaEvents=[];
    document.getElementById('cnt').innerHTML='<div class="empty-note">Erreur: '+e.message+'<br><br><button class="btn-refresh" style="color:var(--ink);border-color:var(--rule)" onclick="resetGcalConfig()">Reconfigurer</button></div>';
  });
}
function pad2(n){return n<10?'0'+n:''+n;}
function renderAgendaEvents(el,events){
  var MOIS=['jan','fev','mar','avr','mai','jun','jul','aou','sep','oct','nov','dec'];
  var now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate()),tomorrow=new Date(today.getTime()+24*60*60*1000);
  var palette=['#b5602a','#2d6e45','#1a4a80','#8b2fc9','#c0392b','#e67e22'];
  var calColors={},colorIdx=0;
  var todayE=[],tomorrowE=[];
  (events||[]).forEach(function(ev){
    var start=ev.start.dateTime?new Date(ev.start.dateTime):new Date(ev.start.date+'T00:00:00');
    var day=new Date(start.getFullYear(),start.getMonth(),start.getDate());
    if(day.getTime()===today.getTime()) todayE.push({ev:ev,start:start});
    else tomorrowE.push({ev:ev,start:start});
  });
  function renderDay(label,evts){
    var h='<div class="agenda-day">'+label+'</div>';
    if(!evts.length){h+='<div class="agenda-empty">Rien de prevu</div>';return h;}
    evts.forEach(function(item){
      var ev=item.ev,start=item.start;
      var endDt=ev.end&&ev.end.dateTime?new Date(ev.end.dateTime):null;
      var isAllDay=!!ev.start.date&&!ev.start.dateTime;
      var timeStr=isAllDay?'Journee':pad2(start.getHours())+':'+pad2(start.getMinutes())+(endDt?' - '+pad2(endDt.getHours())+':'+pad2(endDt.getMinutes()):'');
      var calKey=ev.organizer?ev.organizer.email||'':'';
      if(!calColors[calKey]){calColors[calKey]=palette[colorIdx%palette.length];colorIdx++;}
      var color=calColors[calKey];
      var past=start<now?'opacity:.45;':'';
      var loc=ev.location?'<div class="cal-loc">'+ev.location.substring(0,60)+'</div>':'';
      var link='https://calendar.google.com/calendar/r/day/'+start.getFullYear()+'/'+(start.getMonth()+1)+'/'+start.getDate();
      h+='<a href="'+link+'" target="_blank" style="'+past+'display:flex;gap:12px;align-items:flex-start;border-bottom:1px solid var(--rule2);padding:13px 20px;text-decoration:none;color:inherit">'+
        '<div style="min-width:75px;flex-shrink:0"><div style="font-size:12px;font-weight:600;color:'+color+'">'+timeStr+'</div></div>'+
        '<div style="flex:1"><div class="art-title" style="font-size:14px;margin-bottom:3px">'+(ev.summary||'Sans titre')+'</div>'+loc+'</div></a>';
    });
    return h;
  }
  el.innerHTML='<div>'+
    renderDay("Aujourd hui -- "+today.getDate()+' '+MOIS[today.getMonth()],todayE)+
    renderDay('Demain -- '+tomorrow.getDate()+' '+MOIS[tomorrow.getMonth()],tomorrowE)+
    '<div style="padding:12px 20px"><button class="btn-refresh" style="color:var(--ink);border-color:var(--rule);font-size:10px" onclick="resetGcalConfig()">Changer</button></div></div>';
}

function loadBriefing() {
  document.getElementById('rbtn').disabled=true;
  document.getElementById('rbtn').textContent='...';
  showSkel();
  fetch('briefing.json?t='+Date.now())
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(function(data){
      B=data;
      if(B.timestamp) document.getElementById('hts').textContent=B.timestamp;
      renderBrief(tab);
      fetchAllLiveMetrics();
    })
    .catch(function(){
      document.getElementById('cnt').innerHTML='<div class="empty-note" style="padding:48px 20px"><div style="font-family:Georgia,serif;font-size:20px;margin-bottom:10px">Pas encore de briefing</div><div style="line-height:1.7">GitHub -> Actions -> Run workflow</div></div>';
    })
    .finally(function(){
      document.getElementById('rbtn').disabled=false;
      document.getElementById('rbtn').textContent='Actualiser';
    });
}

loadBriefing();
</script>
