<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Morning Brief">
<title>Morning Brief</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink:#1a1a1a; --paper:#f5f2ed; --cream:#ede9e2; --warm:#e8e2d8;
  --rule:rgba(26,26,26,0.12); --rule2:rgba(26,26,26,0.06);
  --accent:#b5602a; --accent2:#d4924e; --muted:#7a7570;
  --green:#2d6e45; --red:#c0392b; --blue:#1a4a80;
  --surface:#fff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
body{overflow:hidden;position:fixed;width:100%}
#app{height:100%;display:flex;flex-direction:column}

/* NAV PRINCIPALE */
.main-nav{background:var(--ink);flex-shrink:0;padding-top:max(env(safe-area-inset-top,44px),44px)}
.nav-inner{padding:12px 20px 0;display:flex;justify-content:space-between;align-items:flex-end}
.nav-title{font-family:'Playfair Display',serif;font-size:26px;color:#fff;font-weight:400;line-height:1}
.nav-title em{font-style:italic;color:var(--accent2)}
.nav-date{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:4px}
.nav-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.btn-refresh{background:none;border:1px solid rgba(255,255,255,.25);border-radius:4px;padding:7px 13px;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.7);cursor:pointer;font-family:'Inter',sans-serif}
.btn-refresh:disabled{opacity:.3}
.nav-ts{font-size:10px;color:rgba(255,255,255,.25)}

/* SECTION TABS (Brief / Portfolio) */
.section-tabs{background:var(--ink);display:flex;padding:0 20px;margin-top:10px;border-bottom:2px solid rgba(255,255,255,.1)}
.section-tab{padding:10px 20px 12px;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.35);border:none;background:none;cursor:pointer;font-family:'Inter',sans-serif;border-bottom:3px solid transparent;margin-bottom:-2px}
.section-tab.on{color:#fff;border-bottom-color:var(--accent2)}

/* CONTENT TABS */
.content-tabs{background:var(--ink);border-bottom:1px solid rgba(255,255,255,.08);display:flex;overflow-x:auto;padding:0 20px;scrollbar-width:none;flex-shrink:0}
.content-tabs::-webkit-scrollbar{display:none}
.ctab{flex-shrink:0;padding:9px 13px 11px;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.3);border:none;border-bottom:2px solid transparent;background:none;cursor:pointer;white-space:nowrap;font-family:'Inter',sans-serif}
.ctab.on{color:#fff;border-bottom-color:var(--accent2)}

/* CONTENT */
.cnt{flex:1;overflow-y:auto;background:var(--paper);-webkit-overflow-scrolling:touch;padding-bottom:max(env(safe-area-inset-bottom,16px),32px)}

/* SKELETON */
.sk{background:linear-gradient(90deg,var(--cream) 25%,var(--warm) 50%,var(--cream) 75%);background-size:200% 100%;animation:sh 1.3s infinite;border-radius:2px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk-item{border-bottom:1px solid var(--rule2);padding:16px 20px}

/* TYPOGRAPHY */
.sec-rule{font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--rule);padding:16px 20px 8px}
.sum-block{padding:18px 20px 0}
.sum-text{font-family:'Playfair Display',serif;font-size:16px;line-height:1.8;color:#2a2520;border-bottom:1px solid var(--rule);padding-bottom:16px}
.pt-item{border-bottom:1px solid var(--rule2);padding:13px 20px}
.pt-label{font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.pt-title{font-family:'Playfair Display',serif;font-size:14px;color:var(--ink);margin-bottom:4px}
.pt-body{font-size:12px;color:var(--muted);line-height:1.65}
.ts-line{text-align:center;font-size:10px;color:rgba(26,26,26,.2);letter-spacing:.08em;padding:14px 20px}
.empty-note{padding:32px 20px;text-align:center;font-size:13px;color:var(--muted)}

/* ARTICLES */
.art-rule{font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--rule);padding:16px 20px 8px}
.art{display:block;color:inherit;text-decoration:none;border-bottom:1px solid var(--rule2);padding:13px 20px;position:relative}
a.art:active{background:var(--cream)}
.art-meta{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.badge{font-size:9px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;padding:2px 8px;border-radius:2px}
.b-ec{background:rgba(181,96,42,.12);color:#7a3a10}
.b-fi{background:rgba(20,60,150,.1);color:#1a3a80}
.b-bfm{background:rgba(30,100,200,.1);color:#1a50a0}
.b-re{background:rgba(200,60,30,.1);color:#a03020}
.b-lm{background:rgba(0,0,0,.08);color:#444}
.b-ch{background:rgba(40,120,60,.1);color:#206030}
.b-def{background:rgba(0,0,0,.06);color:#555}
.art-time{font-size:10px;color:var(--muted)}
.art-title{font-family:'Playfair Display',serif;font-size:15px;line-height:1.45;color:var(--ink);margin-bottom:5px}
.art-body{font-size:12px;color:var(--muted);line-height:1.65}
.art-cta{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-top:7px;font-weight:500}
.fav-btn{position:absolute;top:13px;right:20px;background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted);padding:2px}
.fav-btn.saved{color:#e8a020}

/* METRICS */
.met-sec{padding:14px 20px 0}
.met-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:4px}
.met{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:12px 13px;display:block;text-decoration:none;color:inherit}
a.met:active{background:var(--cream)}
.met-label{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;display:flex;align-items:center;justify-content:space-between}
.met-label span{font-size:8px;color:var(--accent);letter-spacing:.04em}
.met-row{display:flex;justify-content:space-between;align-items:baseline}
.met-val{font-family:'Playfair Display',serif;font-size:18px;font-weight:600;color:var(--ink)}
.met-chg{font-size:12px;font-weight:500}
.up{color:var(--green)}.dn{color:var(--red)}.fl{color:var(--muted)}

/* TAUX / OAT */
.curve-wrap{padding:16px 20px 0}
.curve-box{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:16px;margin-bottom:12px}
.curve-date{font-size:10px;color:var(--muted);text-align:right;margin-bottom:8px}
.curve-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.curve-item{text-align:center}
.curve-mat{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.curve-rate{font-family:'Playfair Display',serif;font-size:15px;font-weight:600;color:var(--ink)}
.curve-trend{font-size:11px;margin-top:1px}
.curve-diff{font-size:9px;color:var(--muted)}

/* AGENDA */
.cal-item{border-bottom:1px solid var(--rule2);padding:12px 20px;display:flex;gap:12px;align-items:flex-start}
.cal-date{flex-shrink:0;width:52px}
.cal-day{font-size:10px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.cal-time{font-size:11px;color:var(--muted)}
.cal-body{flex:1}
.cal-event{font-family:'Playfair Display',serif;font-size:14px;color:var(--ink);margin-bottom:3px}
.cal-meta{font-size:11px;color:var(--muted)}
.imp-high{border-left:3px solid var(--red)}
.imp-med{border-left:3px solid var(--accent)}
.cal-badge{display:inline-block;font-size:8px;padding:1px 5px;border-radius:2px;margin-right:4px;font-weight:600;letter-spacing:.05em}
.cb-fr{background:rgba(181,96,42,.12);color:#7a3a10}
.cb-eu{background:rgba(45,110,69,.1);color:#1e5232}
.cb-de{background:rgba(0,0,0,.07);color:#444}

/* CURIOSITE */
.curio-block{padding:16px 20px 0}
.curio-card{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:16px;margin-bottom:10px}
.curio-label{font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.curio-chiffre{font-family:'Playfair Display',serif;font-size:32px;font-weight:600;color:var(--ink);margin-bottom:6px}
.curio-text{font-size:13px;color:var(--muted);line-height:1.65}
.curio-source{font-size:10px;color:var(--muted);margin-top:6px;font-style:italic}
.curio-chart{width:100%;height:120px}

/* PORTFOLIO */
.port-header{padding:16px 20px;background:var(--surface);border-bottom:1px solid var(--rule)}
.port-total{font-family:'Playfair Display',serif;font-size:28px;font-weight:600;color:var(--ink)}
.port-perf{font-size:13px;font-weight:500;margin-top:3px}
.port-sub{font-size:11px;color:var(--muted);margin-top:2px}
.port-actions{display:flex;gap:8px;margin-top:12px}
.btn-add{background:var(--ink);color:#fff;border:none;border-radius:4px;padding:9px 16px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;font-family:'Inter',sans-serif}
.btn-sec{background:none;color:var(--muted);border:1px solid var(--rule);border-radius:4px;padding:9px 16px;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;font-family:'Inter',sans-serif}

.port-line{background:var(--surface);border-bottom:1px solid var(--rule2);padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.port-line:active{background:var(--cream)}
.pl-left{}
.pl-ticker{font-size:14px;font-weight:600;color:var(--ink);font-family:'Inter',sans-serif}
.pl-name{font-size:11px;color:var(--muted);margin-top:1px}
.pl-qty{font-size:10px;color:var(--muted);margin-top:2px}
.pl-right{text-align:right}
.pl-value{font-family:'Playfair Display',serif;font-size:16px;font-weight:600;color:var(--ink)}
.pl-perf{font-size:12px;font-weight:500;margin-top:2px}
.pl-pru{font-size:10px;color:var(--muted);margin-top:1px}

.port-section{font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:14px 20px 6px;background:var(--paper)}

/* ANALYSE PORTEFEUILLE */
.analyse-card{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:16px;margin:0 20px 10px}
.analyse-title{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.analyse-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--rule2)}
.analyse-row:last-child{border-bottom:none}
.analyse-label{font-size:12px;color:var(--muted)}
.analyse-val{font-size:13px;font-weight:600;color:var(--ink)}

/* ALLOC CHART */
.alloc-chart{width:100%;height:140px;display:block;margin-bottom:8px}
.alloc-legend{display:flex;flex-wrap:wrap;gap:8px}
.alloc-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.alloc-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* MODAL AJOUT LIGNE */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;align-items:flex-end}
.modal-overlay.open{display:flex}
.modal-sheet{background:var(--surface);border-radius:16px 16px 0 0;padding:20px 24px;padding-bottom:max(env(safe-area-inset-bottom,16px),32px);width:100%;border-top:1px solid var(--rule)}
.modal-handle{width:36px;height:4px;background:var(--rule);border-radius:2px;margin:0 auto 20px}
.modal-title{font-family:'Playfair Display',serif;font-size:20px;margin-bottom:20px}
.modal-label{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.modal-input{width:100%;background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:12px 14px;color:var(--ink);font-size:15px;font-family:'Inter',sans-serif;outline:none;margin-bottom:14px;-webkit-appearance:none}
.modal-input:focus{border-color:var(--accent)}
.modal-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-save{width:100%;padding:15px;background:var(--ink);color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;margin-top:4px}
.modal-del{width:100%;padding:12px;background:none;color:var(--red);border:1px solid rgba(192,57,43,.3);border-radius:6px;font-size:13px;font-weight:500;font-family:'Inter',sans-serif;cursor:pointer;margin-top:8px}

/* SETTINGS */
.settings-section{padding:16px 20px 0}
.settings-label{font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.settings-input{width:100%;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:12px 14px;color:var(--ink);font-size:14px;font-family:'Inter',sans-serif;outline:none;margin-bottom:14px;-webkit-appearance:none}
.settings-input:focus{border-color:var(--accent)}
.settings-save{background:var(--ink);color:#fff;border:none;border-radius:6px;padding:12px 24px;font-size:13px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer}
.settings-note{font-size:11px;color:var(--muted);line-height:1.65;margin-top:8px}

/* ALERT */
.alert-bar{margin:14px 20px 0;background:#fff3e0;border-left:3px solid var(--accent);padding:10px 14px;font-size:12px;color:#7a3a10;line-height:1.6;border-radius:0 4px 4px 0}
</style>
</head>
<body>
<div id="app">
  <div class="main-nav">
    <div class="nav-inner">
      <div>
        <div class="nav-date" id="hdate"></div>
        <div class="nav-title">Morning <em>Brief</em></div>
      </div>
      <div class="nav-right">
        <button class="btn-refresh" id="rbtn" onclick="refresh()">Actualiser</button>
        <div class="nav-ts" id="hts"></div>
      </div>
    </div>
    <div class="section-tabs">
      <button class="section-tab on" onclick="switchSection(this,'brief')">Briefing</button>
      <button class="section-tab" onclick="switchSection(this,'portfolio')">Portefeuille</button>
    </div>
    <div class="content-tabs" id="brief-tabs">
      <button class="ctab on"  onclick="sw(this,'s')">Synthese</button>
      <button class="ctab"     onclick="sw(this,'m')">Marches</button>
      <button class="ctab"     onclick="sw(this,'e')">Entreprises</button>
      <button class="ctab"     onclick="sw(this,'a')">M&amp;A</button>
      <button class="ctab"     onclick="sw(this,'k')">Macro</button>
      <button class="ctab"     onclick="sw(this,'p')">Politique</button>
      <button class="ctab"     onclick="sw(this,'x')">Taux</button>
      <button class="ctab"     onclick="sw(this,'g')">Agenda</button>
      <button class="ctab"     onclick="sw(this,'c')">Curiosite</button>
      <button class="ctab"     onclick="sw(this,'f')">Favoris</button>
    </div>
    <div class="content-tabs" id="port-tabs" style="display:none">
      <button class="ctab on"  onclick="swPort(this,'positions')">Positions</button>
      <button class="ctab"     onclick="swPort(this,'analyse')">Analyse</button>
      <button class="ctab"     onclick="swPort(this,'settings')">Reglages</button>
    </div>
  </div>
  <div class="cnt" id="cnt"></div>
</div>

<!-- MODAL AJOUT/EDIT LIGNE -->
<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-title">Ajouter une ligne</div>
    <div class="modal-label">Ticker Boursorama</div>
    <input class="modal-input" id="m-ticker" placeholder="ex: MC (LVMH), FP (TotalEnergies)" autocomplete="off" autocapitalize="characters">
    <div class="modal-label">Nom</div>
    <input class="modal-input" id="m-name" placeholder="ex: LVMH" autocomplete="off">
    <div class="modal-row">
      <div>
        <div class="modal-label">Quantite</div>
        <input class="modal-input" id="m-qty" type="number" placeholder="10" min="0">
      </div>
      <div>
        <div class="modal-label">PRU (€)</div>
        <input class="modal-input" id="m-pru" type="number" placeholder="450.00" step="0.01" min="0">
      </div>
    </div>
    <div class="modal-label">Type</div>
    <select class="modal-input" id="m-type">
      <option value="action">Action</option>
      <option value="etf">ETF</option>
      <option value="oblig">Obligation</option>
      <option value="crypto">Crypto</option>
    </select>
    <button class="modal-save" onclick="saveLine()">Enregistrer</button>
    <button class="modal-del" id="modal-del" onclick="deleteLine()" style="display:none">Supprimer cette ligne</button>
  </div>
</div>

<script>
var B = null, tab = 's', portTab = 'positions', section = 'brief';
var portfolio = JSON.parse(localStorage.getItem('mb_portfolio') || '[]');
var favorites = JSON.parse(localStorage.getItem('mb_favorites') || '[]');
var githubToken = localStorage.getItem('mb_gh_token') || '';
var editIdx = -1;
var liveQuotes = {};

// Date
var d = new Date();
var DAYS   = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
var MONTHS = ['janvier','fevrier','mars','avril','mai','juin','juillet','aout','septembre','octobre','novembre','decembre'];
document.getElementById('hdate').textContent = DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();

// ── SECTION SWITCH ──
function switchSection(el, s) {
  document.querySelectorAll('.section-tab').forEach(function(x){x.classList.remove('on')});
  el.classList.add('on');
  section = s;
  document.getElementById('brief-tabs').style.display = s === 'brief' ? 'flex' : 'none';
  document.getElementById('port-tabs').style.display  = s === 'portfolio' ? 'flex' : 'none';
  if (s === 'brief') renderBrief(tab);
  else renderPortfolio(portTab);
}

// ── BRIEF TABS ──
function sw(el, t) {
  document.querySelectorAll('#brief-tabs .ctab').forEach(function(x){x.classList.remove('on')});
  el.classList.add('on'); tab = t;
  B ? renderBrief(t) : showSkel();
}

// ── PORTFOLIO TABS ──
function swPort(el, t) {
  document.querySelectorAll('#port-tabs .ctab').forEach(function(x){x.classList.remove('on')});
  el.classList.add('on'); portTab = t;
  renderPortfolio(t);
}

function showSkel() {
  var html = '';
  for (var i = 0; i < 5; i++) {
    html += '<div class="sk-item"><div class="sk" style="height:10px;width:55px;border-radius:20px;margin-bottom:10px"></div><div class="sk" style="height:15px;width:88%;margin-bottom:8px"></div><div class="sk" style="height:15px;width:65%;margin-bottom:10px"></div><div class="sk" style="height:12px;width:100%;margin-bottom:5px"></div><div class="sk" style="height:12px;width:72%"></div></div>';
  }
  document.getElementById('cnt').innerHTML = html;
}

// ── BADGES ──
function badge(src) {
  var s = (src || '').toLowerCase();
  if (s.indexOf('echos') >= 0)    return '<span class="badge b-ec">Les Echos</span>';
  if (s.indexOf('figaro') >= 0)   return '<span class="badge b-fi">Le Figaro</span>';
  if (s.indexOf('bfm') >= 0)      return '<span class="badge b-bfm">BFM</span>';
  if (s.indexOf('reuters') >= 0)  return '<span class="badge b-re">Reuters</span>';
  if (s.indexOf('monde') >= 0)    return '<span class="badge b-lm">Le Monde</span>';
  if (s.indexOf('challenges') >= 0) return '<span class="badge b-ch">Challenges</span>';
  return '<span class="badge b-def">' + (src || 'Web') + '</span>';
}

// ── FAVORITES ──
function isFav(url) {
  return favorites.some(function(f){ return f.url === url; });
}
function toggleFav(url, titre, source) {
  var idx = favorites.findIndex(function(f){ return f.url === url; });
  if (idx >= 0) { favorites.splice(idx, 1); }
  else { favorites.unshift({url:url, titre:titre, source:source, savedAt: new Date().toISOString()}); }
  localStorage.setItem('mb_favorites', JSON.stringify(favorites));
  renderBrief(tab);
}

// ── ARTICLE CARD ──
function artCard(a) {
  var url   = (a.url && a.url.indexOf('http') === 0) ? a.url : null;
  var fav   = url ? isFav(url) : false;
  var tag   = url ? 'a' : 'div';
  var attr  = url ? ' href="' + url + '" target="_blank"' : '';
  var cta   = url ? '<div class="art-cta">Lire -></div>' : '';
  var body  = a.resume ? '<div class="art-body">' + a.resume + '</div>' : '';

// ── OAT CURVE ──
function renderOatCurve(curve) {
  if (!curve || !curve.length) return '';
  var valid = curve.filter(function(p){ return p.rate !== null; });
  var svgHtml = '';
  if (valid.length >= 2) {
    var rates = valid.map(function(p){ return p.rate; });
    var minR = Math.min.apply(null, rates) - 0.1;
    var maxR = Math.max.apply(null, rates) + 0.1;
    var W = 300, H = 80, pad = 12;
    var pts = valid.map(function(p,i) {
      var x = pad + (i/(valid.length-1))*(W-pad*2);
      var y = H - pad - ((p.rate-minR)/(maxR-minR))*(H-pad*2);
      return x.toFixed(1)+','+y.toFixed(1);
    }).join(' ');
    svgHtml = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:80px">' +
      '<polyline points="' + pts + '" fill="none" stroke="#b5602a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
      valid.map(function(p,i){
        var x = pad + (i/(valid.length-1))*(W-pad*2);
        var y = H - pad - ((p.rate-minR)/(maxR-minR))*(H-pad*2);
        return '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="3" fill="#b5602a"/>';
      }).join('') + '</svg>';
  }
  var curveDate = '';
  curve.forEach(function(p){ if (p.date && !curveDate) curveDate = p.date; });
  var items = curve.map(function(p) {
    var arrow = p.trend === 'up' ? '<span style="color:#c0392b">&#9650;</span>' : p.trend === 'down' ? '<span style="color:#2d6e45">&#9660;</span>' : '<span style="color:#7a7570">&#9644;</span>';
    var diff = (p.diff !== null && p.diff !== undefined) ? ((p.diff > 0 ? '+' : '') + p.diff.toFixed(3)) : '';
    return '<div class="curve-item">' +
      '<div class="curve-mat">' + p.maturity + '</div>' +
      '<div class="curve-rate">' + (p.rate !== null ? p.rate.toFixed(2) + '%' : '-') + '</div>' +
      '<div class="curve-trend">' + arrow + '</div>' +
      '<div class="curve-diff">' + diff + '</div>' +
      '</div>';
  }).join('');
  return '<div class="curve-wrap">' +
    '<div class="sec-rule" style="padding:0 0 8px;margin-bottom:12px">Courbe OAT France</div>' +
    '<div class="curve-box">' +
    (curveDate ? '<div class="curve-date">BCE : ' + curveDate + '</div>' : '') +
    svgHtml +
    '<div class="curve-grid">' + items + '</div>' +
    '</div></div>';
}

// ── STOOQ QUOTE ──
function fetchStooq(sym, callback) {
  var url = 'https://stooq.com/q/l/?s=' + sym + '&f=sd2t2ohlcv&h&e=csv';
  fetch(url)
    .then(function(r){ return r.text(); })
    .then(function(text){
      var lines = text.trim().split('\n');
      if (lines.length < 2) { callback(null); return; }
      var vals = lines[1].split(',');
      var close = parseFloat(vals[4]);
      var open  = parseFloat(vals[3]);
      if (!close || close <= 0) { callback(null); return; }
      var pct = (close - open) / open * 100;
      callback({close: close, open: open, pct: pct});
    })
    .catch(function(){ callback(null); });
}

// ── PORTFOLIO ──
var SECTOR_COLORS = ['#b5602a','#2d6e45','#1a4a80','#8b2fc9','#c0392b','#e67e22','#27ae60','#2980b9'];

function getTicker(line) {
  if (line.type === 'crypto') return line.ticker.toLowerCase() + 'usd';
  if (line.type === 'etf' || line.type === 'action') return line.ticker.toLowerCase() + '.pl';
  return line.ticker.toLowerCase();
}

function loadLiveQuotes(callback) {
  if (!portfolio.length) { callback(); return; }
  var done = 0;
  portfolio.forEach(function(line, i) {
    var sym = line.stooqSym || (line.ticker.toLowerCase() + '.pl');
    fetchStooq(sym, function(q) {
      if (q) liveQuotes[line.ticker] = q;
      done++;
      if (done === portfolio.length) callback();
    });
  });
}

function calcPortfolio() {
  var totalValue = 0, totalCost = 0, totalDayPL = 0;
  portfolio.forEach(function(line) {
    var q = liveQuotes[line.ticker];
    var price = q ? q.close : (line.lastPrice || 0);
    var cost  = line.qty * line.pru;
    var value = line.qty * price;
    totalValue += value;
    totalCost  += cost;
    if (q) totalDayPL += line.qty * (q.close - q.open);
  });
  return {totalValue: totalValue, totalCost: totalCost, totalDayPL: totalDayPL,
          totalPL: totalValue - totalCost, plPct: totalCost > 0 ? (totalValue-totalCost)/totalCost*100 : 0};
}

function renderPortfolio(t) {
  var el = document.getElementById('cnt');
  if (t === 'positions') {
    if (!portfolio.length) {
      el.innerHTML = '<div class="empty-note" style="padding:48px 20px">' +
        '<div style="font-family:\'Playfair Display\',serif;font-size:22px;margin-bottom:10px">Mon portefeuille</div>' +
        '<div style="line-height:1.7;margin-bottom:20px">Ajoutez vos premieres lignes pour suivre votre portefeuille en temps reel.</div>' +
        '<button class="btn-add" onclick="openModal(-1)">+ Ajouter une ligne</button></div>';
      return;
    }
    var calc = calcPortfolio();
    var plColor = calc.totalPL >= 0 ? 'var(--green)' : 'var(--red)';
    var dayColor = calc.totalDayPL >= 0 ? 'var(--green)' : 'var(--red)';
    var html = '<div class="port-header">' +
      '<div style="font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px">Valeur totale</div>' +
      '<div class="port-total">' + formatEuro(calc.totalValue) + '</div>' +
      '<div class="port-perf" style="color:' + plColor + '">' +
        (calc.totalPL >= 0 ? '+' : '') + formatEuro(calc.totalPL) + ' (' + (calc.totalPL >= 0?'+':'') + calc.plPct.toFixed(2) + '% depuis PRU)' +
      '</div>' +
      '<div class="port-sub">Journee: <span style="color:' + dayColor + ';font-weight:500">' + (calc.totalDayPL >= 0?'+':'') + formatEuro(calc.totalDayPL) + '</span></div>' +
      '<div class="port-actions"><button class="btn-add" onclick="openModal(-1)">+ Ajouter</button>' +
      '<button class="btn-sec" onclick="loadLiveQuotes(function(){renderPortfolio(\'positions\')})">Actualiser cours</button></div>' +
      '</div>';

    // Group by type
    var types = {action:'Actions', etf:'ETF', oblig:'Obligations', crypto:'Crypto'};
    var grouped = {};
    portfolio.forEach(function(line, i){ 
      var t2 = line.type || 'action';
      if (!grouped[t2]) grouped[t2] = [];
      grouped[t2].push({line:line, idx:i});
    });

    Object.keys(types).forEach(function(type) {
      if (!grouped[type]) return;
      html += '<div class="port-section">' + types[type] + '</div>';
      grouped[type].forEach(function(item) {
        var line = item.line, idx = item.idx;
        var q = liveQuotes[line.ticker];
        var price = q ? q.close : (line.lastPrice || 0);
        var value = line.qty * price;
        var plLine = price > 0 ? (price - line.pru) / line.pru * 100 : 0;
        var dayPl  = q ? (q.close - q.open) / q.open * 100 : 0;
        var plColor2 = plLine >= 0 ? 'var(--green)' : 'var(--red)';
        var dayColor2 = dayPl >= 0 ? 'var(--green)' : 'var(--red)';
        var alert2 = (Math.abs(dayPl) > 2) ? ' <span style="color:' + dayColor2 + ';font-size:10px;font-weight:700">' + (dayPl>0?'↑':'↓') + Math.abs(dayPl).toFixed(1) + '%</span>' : '';
        html += '<div class="port-line" onclick="openModal(' + idx + ')">' +
          '<div class="pl-left">' +
          '<div class="pl-ticker">' + line.ticker + alert2 + '</div>' +
          '<div class="pl-name">' + (line.name||'') + '</div>' +
          '<div class="pl-qty">' + line.qty + ' titres · PRU ' + formatEuro(line.pru) + '</div>' +
          '</div>' +
          '<div class="pl-right">' +
          '<div class="pl-value">' + (price > 0 ? formatEuro(value) : '-') + '</div>' +
          '<div class="pl-perf" style="color:' + plColor2 + '">' + (plLine >= 0?'+':'') + plLine.toFixed(2) + '%</div>' +
          (q ? '<div class="pl-pru" style="color:' + dayColor2 + '">' + (dayPl>=0?'+':'') + dayPl.toFixed(2) + '% auj.</div>' : '') +
          '</div></div>';
      });
    });
    el.innerHTML = html;
  }
  else if (t === 'analyse') {
    if (!portfolio.length) { el.innerHTML = '<div class="empty-note">Ajoutez des lignes dans votre portefeuille pour voir l\'analyse.</div>'; return; }
    var calc2 = calcPortfolio();
    loadLiveQuotes(function() {
      var html = '<div style="padding:16px 0 0">';

      // Performance globale
      html += '<div class="analyse-card">' +
        '<div class="analyse-title">Performance globale</div>';
      var rows = [
        ['Valeur totale', formatEuro(calc2.totalValue)],
        ['Investissement', formatEuro(calc2.totalCost)],
        ['P&L total', (calc2.totalPL>=0?'+':'') + formatEuro(calc2.totalPL) + ' (' + (calc2.plPct>=0?'+':'') + calc2.plPct.toFixed(2) + '%)'],
        ['P&L journee', (calc2.totalDayPL>=0?'+':'') + formatEuro(calc2.totalDayPL)],
      ];
      rows.forEach(function(r) {
        html += '<div class="analyse-row"><div class="analyse-label">' + r[0] + '</div><div class="analyse-val">' + r[1] + '</div></div>';
      });
      html += '</div>';

      // Allocation sectorielle
      var typeMap = {action:'Actions', etf:'ETF', oblig:'Obligations', crypto:'Crypto'};
      var typeTotals = {};
      portfolio.forEach(function(line) {
        var q2 = liveQuotes[line.ticker];
        var price2 = q2 ? q2.close : (line.lastPrice || line.pru);
        var val2 = line.qty * price2;
        var t3 = line.type || 'action';
        typeTotals[t3] = (typeTotals[t3] || 0) + val2;
      });
      var total = calc2.totalValue || 1;
      var typeKeys = Object.keys(typeTotals);
      if (typeKeys.length > 1) {
        var W3=200, H3=200, cx=100, cy=100, r=80;
        var startAngle = -Math.PI/2;
        var svgSlices = '';
        typeKeys.forEach(function(type, i) {
          var pct2 = typeTotals[type] / total;
          var angle = pct2 * Math.PI * 2;
          var x1 = cx + r * Math.cos(startAngle);
          var y1 = cy + r * Math.sin(startAngle);
          var x2 = cx + r * Math.cos(startAngle + angle);
          var y2 = cy + r * Math.sin(startAngle + angle);
          var large = angle > Math.PI ? 1 : 0;
          svgSlices += '<path d="M'+cx+','+cy+' L'+x1.toFixed(1)+','+y1.toFixed(1)+' A'+r+','+r+' 0 '+large+',1 '+x2.toFixed(1)+','+y2.toFixed(1)+' Z" fill="' + SECTOR_COLORS[i%SECTOR_COLORS.length] + '" opacity="0.85"/>';
          startAngle += angle;
        });
        var legend = typeKeys.map(function(type, i) {
          return '<div class="alloc-item"><div class="alloc-dot" style="background:' + SECTOR_COLORS[i%SECTOR_COLORS.length] + '"></div>' + (typeMap[type]||type) + ' ' + (typeTotals[type]/total*100).toFixed(1) + '%</div>';
        }).join('');
        html += '<div class="analyse-card">' +
          '<div class="analyse-title">Allocation</div>' +
          '<svg viewBox="0 0 200 200" class="alloc-chart">' + svgSlices + '</svg>' +
          '<div class="alloc-legend">' + legend + '</div></div>';
      }

      // Concentration
      var lineValues = portfolio.map(function(line) {
        var q3 = liveQuotes[line.ticker];
        var p3 = q3 ? q3.close : (line.lastPrice || line.pru);
        return {name: line.name||line.ticker, value: line.qty*p3};
      }).sort(function(a,b){ return b.value - a.value; });
      if (lineValues.length > 0) {
        var top3val = lineValues.slice(0,3).reduce(function(s,l){ return s+l.value; }, 0);
        var top1pct = total > 0 ? (lineValues[0].value/total*100).toFixed(1) : '0';
        var top3pct = total > 0 ? (top3val/total*100).toFixed(1) : '0';
        html += '<div class="analyse-card"><div class="analyse-title">Concentration</div>' +
          '<div class="analyse-row"><div class="analyse-label">1ere ligne (' + lineValues[0].name + ')</div><div class="analyse-val">' + top1pct + '%</div></div>' +
          '<div class="analyse-row"><div class="analyse-label">Top 3 lignes</div><div class="analyse-val">' + top3pct + '%</div></div>' +
          '<div class="analyse-row"><div class="analyse-label">Nombre de lignes</div><div class="analyse-val">' + portfolio.length + '</div></div>' +
          '</div>';
      }

      // Performance par ligne
      html += '<div class="analyse-card"><div class="analyse-title">Performance par ligne</div>';
      var sorted = portfolio.map(function(line) {
        var q4 = liveQuotes[line.ticker];
        var p4 = q4 ? q4.close : (line.lastPrice || 0);
        var pl = p4 > 0 ? (p4 - line.pru)/line.pru*100 : 0;
        return {name: line.name||line.ticker, pl: pl};
      }).sort(function(a,b){ return b.pl - a.pl; });
      sorted.forEach(function(item) {
        var c3 = item.pl >= 0 ? 'var(--green)' : 'var(--red)';
        html += '<div class="analyse-row"><div class="analyse-label">' + item.name + '</div><div class="analyse-val" style="color:' + c3 + '">' + (item.pl>=0?'+':'') + item.pl.toFixed(2) + '%</div></div>';
      });
      html += '</div>';

      // Momentum (variation jour)
      var hasLive = portfolio.some(function(l){ return !!liveQuotes[l.ticker]; });
      if (hasLive) {
        html += '<div class="analyse-card"><div class="analyse-title">Momentum du jour</div>';
        var sortedDay = portfolio.map(function(line) {
          var q5 = liveQuotes[line.ticker];
          var dayPl2 = q5 ? (q5.close - q5.open)/q5.open*100 : null;
          return {name: line.name||line.ticker, dayPl: dayPl2};
        }).filter(function(l){ return l.dayPl !== null; })
          .sort(function(a,b){ return b.dayPl - a.dayPl; });
        sortedDay.forEach(function(item) {
          var c4 = item.dayPl >= 0 ? 'var(--green)' : 'var(--red)';
          html += '<div class="analyse-row"><div class="analyse-label">' + item.name + '</div><div class="analyse-val" style="color:' + c4 + '">' + (item.dayPl>=0?'+':'') + item.dayPl.toFixed(2) + '% auj.</div></div>';
        });
        html += '</div>';
      }

      // Articles lies au portefeuille
      if (B) {
        var tickers = portfolio.map(function(l){ return (l.name||l.ticker).toLowerCase(); });
        var related = [];
        ['marches','entreprises','ma','macro'].forEach(function(key) {
          var arts2 = B[key] && B[key].articles ? B[key].articles : [];
          arts2.forEach(function(a) {
            var titre2 = (a.titre||'').toLowerCase();
            if (tickers.some(function(t4){ return t4.length > 3 && titre2.indexOf(t4) >= 0; })) {
              related.push(a);
            }
          });
        });
        if (related.length > 0) {
          html += '<div class="art-rule">Articles lies a votre portefeuille</div>';
          related.slice(0,5).forEach(function(a) { html += artCard(a); });
        }
      }

      html += '</div>';
      el.innerHTML = html;
    });
  }
  else if (t === 'settings') {
    el.innerHTML = '<div class="settings-section">' +
      '<div class="sec-rule" style="padding:0 0 8px;margin-bottom:16px">Configuration</div>' +
      '<div class="settings-label">Token GitHub (pour sauvegarder)</div>' +
      '<input class="settings-input" type="password" id="gh-token" value="' + githubToken + '" placeholder="ghp_..." autocomplete="off">' +
      '<div class="settings-note">Permet de sauvegarder votre portefeuille dans GitHub. Cree un token avec permission "contents" sur github.com/settings/tokens</div>' +
      '<button class="settings-save" onclick="saveSettings()">Enregistrer</button>' +
      '<div style="margin-top:24px"><div class="settings-label">Donnees locales</div>' +
      '<button class="btn-sec" style="margin-top:8px" onclick="exportPortfolio()">Exporter JSON</button>' +
      '</div></div>';
  }
}

function saveSettings() {
  githubToken = document.getElementById('gh-token').value.trim();
  localStorage.setItem('mb_gh_token', githubToken);
  alert('Enregistre.');
}

function exportPortfolio() {
  var data = JSON.stringify({portfolio: portfolio, favorites: favorites}, null, 2);
  var blob = new Blob([data], {type: 'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'morning-brief-data.json';
  a.click();
}

// ── MODAL PORTFOLIO ──
function openModal(idx) {
  editIdx = idx;
  var modal = document.getElementById('modal');
  var delBtn = document.getElementById('modal-del');
  if (idx >= 0 && portfolio[idx]) {
    var line = portfolio[idx];
    document.getElementById('modal-title').textContent = 'Modifier ' + line.ticker;
    document.getElementById('m-ticker').value = line.ticker;
    document.getElementById('m-name').value   = line.name || '';
    document.getElementById('m-qty').value    = line.qty;
    document.getElementById('m-pru').value    = line.pru;
    document.getElementById('m-type').value   = line.type || 'action';
    delBtn.style.display = 'block';
  } else {
    document.getElementById('modal-title').textContent = 'Ajouter une ligne';
    document.getElementById('m-ticker').value = '';
    document.getElementById('m-name').value   = '';
    document.getElementById('m-qty').value    = '';
    document.getElementById('m-pru').value    = '';
    document.getElementById('m-type').value   = 'action';
    delBtn.style.display = 'none';
  }
  modal.classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

function saveLine() {
  var ticker = document.getElementById('m-ticker').value.trim().toUpperCase();
  var name   = document.getElementById('m-name').value.trim();
  var qty    = parseFloat(document.getElementById('m-qty').value);
  var pru    = parseFloat(document.getElementById('m-pru').value);
  var type   = document.getElementById('m-type').value;
  if (!ticker || isNaN(qty) || isNaN(pru) || qty <= 0) {
    alert('Renseignez le ticker, la quantite et le PRU.');
    return;
  }
  var line = {ticker:ticker, name:name, qty:qty, pru:pru, type:type, stooqSym: ticker.toLowerCase()+'.pl'};
  if (editIdx >= 0) portfolio[editIdx] = line;
  else portfolio.push(line);
  localStorage.setItem('mb_portfolio', JSON.stringify(portfolio));
  closeModal();
  renderPortfolio('positions');
}

function deleteLine() {
  if (editIdx >= 0) {
    portfolio.splice(editIdx, 1);
    localStorage.setItem('mb_portfolio', JSON.stringify(portfolio));
  }
  closeModal();
  renderPortfolio('positions');
}

// ── UTILS ──
function formatEuro(v) {
  if (!v && v !== 0) return '-';
  return (v < 0 ? '-' : '') + Math.abs(v).toLocaleString('fr-FR', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' EUR';
}

// ── LOAD BRIEFING ──
function refresh() {
  document.getElementById('rbtn').disabled = true;
  document.getElementById('rbtn').textContent = '...';
  showSkel();
  fetch('briefing.json?t=' + Date.now())
    .then(function(r){ if (!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(data) {
      B = data;
      if (B.timestamp) document.getElementById('hts').textContent = B.timestamp;
      if (section === 'brief') renderBrief(tab);
    })
    .catch(function() {
      document.getElementById('cnt').innerHTML = '<div class="empty-note" style="padding:48px 20px">' +
        '<div style="font-family:\'Playfair Display\',serif;font-size:20px;margin-bottom:10px">Pas encore de briefing</div>' +
        '<div style="line-height:1.7">GitHub -> Actions -> Run workflow</div></div>';
    })
    .finally(function() {
      document.getElementById('rbtn').disabled = false;
      document.getElementById('rbtn').textContent = 'Actualiser';
    });
}

// Init
refresh();
if (portfolio.length > 0) {
  loadLiveQuotes(function() {
    if (section === 'portfolio') renderPortfolio(portTab);
  });
}
</script>
