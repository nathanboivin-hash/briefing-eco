<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Morning Brief">
<title>Morning Brief</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink:#1a1a1a; --paper:#f5f2ed; --cream:#ede9e2; --warm:#e8e2d8;
  --rule:rgba(26,26,26,0.12); --rule2:rgba(26,26,26,0.06);
  --accent:#b5602a; --accent2:#d4924e; --muted:#7a7570;
  --green:#2d6e45; --red:#c0392b; --blue:#1a4a80;
  --surface:#fff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
body{overflow:hidden;position:fixed;width:100%}
#app{height:100%;display:flex;flex-direction:column}

/* NAV PRINCIPALE */
.main-nav{background:var(--ink);flex-shrink:0;padding-top:max(env(safe-area-inset-top,44px),44px)}
.nav-inner{padding:12px 20px 0;display:flex;justify-content:space-between;align-items:flex-end}
.nav-title{font-family:'Playfair Display',serif;font-size:26px;color:#fff;font-weight:400;line-height:1}
.nav-title em{font-style:italic;color:var(--accent2)}
.nav-date{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:4px}
.nav-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.btn-refresh{background:none;border:1px solid rgba(255,255,255,.25);border-radius:4px;padding:7px 13px;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.7);cursor:pointer;font-family:'Inter',sans-serif}
.btn-refresh:disabled{opacity:.3}
.nav-ts{font-size:10px;color:rgba(255,255,255,.25)}

/* SECTION TABS (Brief / Portfolio) */
.section-tabs{background:var(--ink);display:flex;padding:0 20px;margin-top:10px;border-bottom:2px solid rgba(255,255,255,.1)}
.section-tab{padding:10px 20px 12px;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.35);border:none;background:none;cursor:pointer;font-family:'Inter',sans-serif;border-bottom:3px solid transparent;margin-bottom:-2px}
.section-tab.on{color:#fff;border-bottom-color:var(--accent2)}

/* CONTENT TABS */
.content-tabs{background:var(--ink);border-bottom:1px solid rgba(255,255,255,.08);display:flex;overflow-x:auto;padding:0 20px;scrollbar-width:none;flex-shrink:0}
.content-tabs::-webkit-scrollbar{display:none}
.ctab{flex-shrink:0;padding:9px 13px 11px;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.3);border:none;border-bottom:2px solid transparent;background:none;cursor:pointer;white-space:nowrap;font-family:'Inter',sans-serif}
.ctab.on{color:#fff;border-bottom-color:var(--accent2)}

/* CONTENT */
.cnt{flex:1;overflow-y:auto;background:var(--paper);-webkit-overflow-scrolling:touch;padding-bottom:max(env(safe-area-inset-bottom,16px),32px)}

/* SKELETON */
.sk{background:linear-gradient(90deg,var(--cream) 25%,var(--warm) 50%,var(--cream) 75%);background-size:200% 100%;animation:sh 1.3s infinite;border-radius:2px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk-item{border-bottom:1px solid var(--rule2);padding:16px 20px}

/* TYPOGRAPHY */
.sec-rule{font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--rule);padding:16px 20px 8px}
.sum-block{padding:18px 20px 0}
.sum-text{font-family:'Playfair Display',serif;font-size:16px;line-height:1.8;color:#2a2520;border-bottom:1px solid var(--rule);padding-bottom:16px}
.pt-item{border-bottom:1px solid var(--rule2);padding:13px 20px}
.pt-label{font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.pt-title{font-family:'Playfair Display',serif;font-size:14px;color:var(--ink);margin-bottom:4px}
.pt-body{font-size:12px;color:var(--muted);line-height:1.65}
.ts-line{text-align:center;font-size:10px;color:rgba(26,26,26,.2);letter-spacing:.08em;padding:14px 20px}
.empty-note{padding:32px 20px;text-align:center;font-size:13px;color:var(--muted)}

/* ARTICLES */
.art-rule{font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--rule);padding:16px 20px 8px}
.art{display:block;color:inherit;text-decoration:none;border-bottom:1px solid var(--rule2);padding:13px 20px;position:relative}
a.art:active{background:var(--cream)}
.art-meta{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.badge{font-size:9px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;padding:2px 8px;border-radius:2px}
.b-ec{background:rgba(181,96,42,.12);color:#7a3a10}
.b-fi{background:rgba(20,60,150,.1);color:#1a3a80}
.b-bfm{background:rgba(30,100,200,.1);color:#1a50a0}
.b-re{background:rgba(200,60,30,.1);color:#a03020}
.b-lm{background:rgba(0,0,0,.08);color:#444}
.b-ch{background:rgba(40,120,60,.1);color:#206030}
.b-def{background:rgba(0,0,0,.06);color:#555}
.art-time{font-size:10px;color:var(--muted)}
.art-title{font-family:'Playfair Display',serif;font-size:15px;line-height:1.45;color:var(--ink);margin-bottom:5px}
.art-body{font-size:12px;color:var(--muted);line-height:1.65}
.art-cta{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-top:7px;font-weight:500}
.fav-btn{position:absolute;top:13px;right:20px;background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted);padding:2px}
.fav-btn.saved{color:#e8a020}

/* METRICS */
.met-sec{padding:14px 20px 0}
.met-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:4px}
.met{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:12px 13px;display:block;text-decoration:none;color:inherit}
a.met:active{background:var(--cream)}
.met-label{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;display:flex;align-items:center;justify-content:space-between}
.met-label span{font-size:8px;color:var(--accent);letter-spacing:.04em}
.met-row{display:flex;justify-content:space-between;align-items:baseline}
.met-val{font-family:'Playfair Display',serif;font-size:18px;font-weight:600;color:var(--ink)}
.met-chg{font-size:12px;font-weight:500}
.up{color:var(--green)}.dn{color:var(--red)}.fl{color:var(--muted)}

/* TAUX / OAT */
.curve-wrap{padding:16px 20px 0}
.curve-box{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:16px;margin-bottom:12px}
.curve-date{font-size:10px;color:var(--muted);text-align:right;margin-bottom:8px}
.curve-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.curve-item{text-align:center}
.curve-mat{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.curve-rate{font-family:'Playfair Display',serif;font-size:15px;font-weight:600;color:var(--ink)}
.curve-trend{font-size:11px;margin-top:1px}
.curve-diff{font-size:9px;color:var(--muted)}

/* AGENDA */
.cal-item{border-bottom:1px solid var(--rule2);padding:12px 20px;display:flex;gap:12px;align-items:flex-start}
.cal-date{flex-shrink:0;width:52px}
.cal-day{font-size:10px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.cal-time{font-size:11px;color:var(--muted)}
.cal-body{flex:1}
.cal-event{font-family:'Playfair Display',serif;font-size:14px;color:var(--ink);margin-bottom:3px}
.cal-meta{font-size:11px;color:var(--muted)}
.imp-high{border-left:3px solid var(--red)}
.imp-med{border-left:3px solid var(--accent)}
.cal-badge{display:inline-block;font-size:8px;padding:1px 5px;border-radius:2px;margin-right:4px;font-weight:600;letter-spacing:.05em}
.cb-fr{background:rgba(181,96,42,.12);color:#7a3a10}
.cb-eu{background:rgba(45,110,69,.1);color:#1e5232}
.cb-de{background:rgba(0,0,0,.07);color:#444}

/* CURIOSITE */
.curio-block{padding:16px 20px 0}
.curio-card{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:16px;margin-bottom:10px}
.curio-label{font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.curio-chiffre{font-family:'Playfair Display',serif;font-size:32px;font-weight:600;color:var(--ink);margin-bottom:6px}
.curio-text{font-size:13px;color:var(--muted);line-height:1.65}
.curio-source{font-size:10px;color:var(--muted);margin-top:6px;font-style:italic}
.curio-chart{width:100%;height:120px}

/* PORTFOLIO */
.port-wrap { max-width: 600px; margin: 0 auto }

/* HEADER PORTFOLIO */
.port-hero { background: var(--ink); color: #fff; padding: 20px 20px 0 }
.port-hero-label { font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:rgba(255,255,255,.4); margin-bottom:6px }
.port-hero-val { font-family:'Playfair Display',serif; font-size:36px; font-weight:600; color:#fff; line-height:1 }
.port-hero-row { display:flex; align-items:center; gap:12px; margin-top:6px }
.port-hero-pl { font-size:14px; font-weight:500 }
.port-hero-day { font-size:12px; color:rgba(255,255,255,.5) }
.port-hero-tabs { display:flex; gap:0; margin-top:16px; border-bottom:1px solid rgba(255,255,255,.1) }
.port-hero-tab { padding:10px 16px; font-size:11px; font-weight:500; letter-spacing:.08em; text-transform:uppercase; color:rgba(255,255,255,.4); border:none; background:none; cursor:pointer; font-family:'Inter',sans-serif; border-bottom:2px solid transparent; white-space:nowrap }
.port-hero-tab.on { color:#fff; border-bottom-color:var(--accent2) }

/* LIGNE PORTFOLIO */
.port-line { display:flex; justify-content:space-between; align-items:center; padding:14px 20px; border-bottom:1px solid var(--rule2); background:var(--surface); cursor:pointer; transition:background .1s }
.port-line:active, .port-line:hover { background:var(--cream) }
.pl-left { display:flex; align-items:center; gap:12px }
.pl-icon { width:40px; height:40px; border-radius:10px; background:var(--paper); border:1px solid var(--rule); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--ink); flex-shrink:0; font-family:'Inter',sans-serif }
.pl-info {}
.pl-ticker { font-size:14px; font-weight:600; color:var(--ink); font-family:'Inter',sans-serif; display:flex; align-items:center; gap:6px }
.pl-name { font-size:11px; color:var(--muted); margin-top:1px }
.pl-qty-pru { font-size:10px; color:var(--muted); margin-top:2px }
.pl-right { text-align:right }
.pl-price { font-family:'Playfair Display',serif; font-size:17px; font-weight:600; color:var(--ink) }
.pl-day { font-size:12px; font-weight:500; margin-top:2px }
.pl-total { font-size:10px; color:var(--muted); margin-top:2px }
.pl-pl { font-size:11px; font-weight:500; margin-top:1px }
.alert-badge { background:var(--red); color:#fff; font-size:9px; font-weight:700; padding:1px 5px; border-radius:3px; letter-spacing:.04em }

/* SECTION HEADER */
.port-section-hdr { font-size:10px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); padding:14px 20px 6px; background:var(--paper); display:flex; justify-content:space-between; align-items:center }
.port-section-val { font-size:11px; font-weight:500; color:var(--ink) }

/* ACTIONS BAR */
.port-actions-bar { display:flex; gap:8px; padding:16px 20px; background:var(--paper); border-bottom:1px solid var(--rule2) }
.btn-primary { background:var(--ink); color:#fff; border:none; border-radius:6px; padding:10px 18px; font-size:12px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; cursor:pointer; font-family:'Inter',sans-serif; display:flex; align-items:center; gap:6px }
.btn-secondary { background:none; color:var(--muted); border:1px solid var(--rule); border-radius:6px; padding:10px 14px; font-size:11px; font-weight:500; cursor:pointer; font-family:'Inter',sans-serif }

/* ANALYSE */
.analyse-wrap { padding:0 0 20px }
.kpi-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; padding:16px 20px 8px }
.kpi { background:var(--surface); border:1px solid var(--rule); border-radius:8px; padding:14px }
.kpi-label { font-size:10px; font-weight:500; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:6px }
.kpi-val { font-family:'Playfair Display',serif; font-size:22px; font-weight:600; color:var(--ink) }
.kpi-sub { font-size:11px; color:var(--muted); margin-top:3px }

/* PIE CHART */
.pie-wrap { background:var(--surface); border:1px solid var(--rule); border-radius:8px; margin:0 20px 10px; padding:16px }
.pie-title { font-size:10px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:12px }
.pie-inner { display:flex; align-items:center; gap:16px }
.pie-legend { flex:1 }
.pie-item { display:flex; align-items:center; gap:8px; padding:4px 0; border-bottom:1px solid var(--rule2) }
.pie-item:last-child { border:none }
.pie-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0 }
.pie-item-label { flex:1; font-size:12px; color:var(--ink) }
.pie-item-pct { font-size:12px; font-weight:600; color:var(--ink) }
.pie-item-val { font-size:10px; color:var(--muted) }

/* PERF TABLE */
.perf-table { background:var(--surface); border:1px solid var(--rule); border-radius:8px; margin:0 20px 10px; overflow:hidden }
.perf-header { display:grid; grid-template-columns:1fr 80px 80px 80px; padding:10px 14px; background:var(--paper); border-bottom:1px solid var(--rule) }
.perf-header-cell { font-size:9px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); text-align:right }
.perf-header-cell:first-child { text-align:left }
.perf-row { display:grid; grid-template-columns:1fr 80px 80px 80px; padding:11px 14px; border-bottom:1px solid var(--rule2) }
.perf-row:last-child { border:none }
.perf-name { font-size:13px; font-weight:500; color:var(--ink) }
.perf-cell { font-size:13px; font-weight:500; text-align:right }

/* RISQUE */
.risk-bar-wrap { padding:6px 0 }
.risk-bar-label { display:flex; justify-content:space-between; margin-bottom:4px }
.risk-bar-name { font-size:12px; color:var(--muted) }
.risk-bar-val { font-size:12px; font-weight:600 }
.risk-bar-track { height:6px; background:var(--rule); border-radius:3px; overflow:hidden }
.risk-bar-fill { height:100%; border-radius:3px; transition:width .4s ease }

/* MODAL */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:200; display:none; align-items:flex-end }
.modal-overlay.open { display:flex }
.modal-sheet { background:var(--surface); border-radius:16px 16px 0 0; padding:20px 24px; padding-bottom:max(env(safe-area-inset-bottom,16px),32px); width:100%; border-top:1px solid var(--rule); max-height:90vh; overflow-y:auto }
.modal-handle { width:36px; height:4px; background:var(--rule); border-radius:2px; margin:0 auto 20px }
.modal-title { font-family:'Playfair Display',serif; font-size:20px; margin-bottom:20px }
.modal-label { font-size:10px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:7px }
.modal-input { width:100%; background:var(--paper); border:1px solid var(--rule); border-radius:6px; padding:12px 14px; color:var(--ink); font-size:15px; font-family:'Inter',sans-serif; outline:none; margin-bottom:14px; -webkit-appearance:none }
.modal-input:focus { border-color:var(--accent) }
.modal-hint { font-size:11px; color:var(--muted); margin:-10px 0 14px; line-height:1.5 }
.modal-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px }
.modal-save { width:100%; padding:15px; background:var(--ink); color:#fff; border:none; border-radius:6px; font-size:14px; font-weight:600; font-family:'Inter',sans-serif; cursor:pointer; margin-top:4px }
.modal-del { width:100%; padding:12px; background:none; color:var(--red); border:1px solid rgba(192,57,43,.3); border-radius:6px; font-size:13px; font-weight:500; font-family:'Inter',sans-serif; cursor:pointer; margin-top:8px }

/* SETTINGS */
.settings-wrap { padding:20px }
.settings-label { font-size:10px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; margin-top:16px }
.settings-input { width:100%; background:var(--surface); border:1px solid var(--rule); border-radius:6px; padding:12px 14px; color:var(--ink); font-size:14px; font-family:'Inter',sans-serif; outline:none; margin-bottom:4px; -webkit-appearance:none }
.settings-input:focus { border-color:var(--accent) }
.settings-note { font-size:11px; color:var(--muted); line-height:1.65; margin-bottom:14px }
.settings-save { background:var(--ink); color:#fff; border:none; border-radius:6px; padding:12px 24px; font-size:13px; font-weight:600; font-family:'Inter',sans-serif; cursor:pointer }

<!-- MODAL AJOUT/EDIT LIGNE -->
<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-title">Ajouter une ligne</div>
    <div class="modal-label">Ticker Yahoo Finance</div>
    <input class="modal-input" id="m-ticker" placeholder="ex: MC.PA, AIR.PA, MSFT" autocomplete="off" autocapitalize="characters">
    <div class="modal-hint">Actions françaises : ajouter .PA (ex: MC.PA pour LVMH)<br>ETF Amundi : ex: CW8.PA, PE500.PA</div>
    <div class="modal-label">Nom affiché</div>
    <input class="modal-input" id="m-name" placeholder="ex: LVMH" autocomplete="off">
    <div class="modal-grid">
      <div>
        <div class="modal-label">Quantité</div>
        <input class="modal-input" id="m-qty" type="number" placeholder="10" min="0" step="1">
      </div>
      <div>
        <div class="modal-label">PRU (€)</div>
        <input class="modal-input" id="m-pru" type="number" placeholder="450.00" step="0.01" min="0">
      </div>
    </div>
    <div class="modal-label">Type</div>
    <select class="modal-input" id="m-type">
      <option value="action">Action</option>
      <option value="etf">ETF</option>
    </select>
    <div class="modal-label">Secteur</div>
    <select class="modal-input" id="m-sector">
      <option value="Luxe">Luxe</option>
      <option value="Energie">Energie</option>
      <option value="Finance">Finance</option>
      <option value="Industrie">Industrie</option>
      <option value="Sante">Sante</option>
      <option value="Tech">Tech</option>
      <option value="Conso">Consommation</option>
      <option value="Telecom">Telecom</option>
      <option value="Immo">Immobilier</option>
      <option value="ETF">ETF</option>
      <option value="Autre">Autre</option>
    </select>
    <button class="modal-save" onclick="saveLine()">Enregistrer</button>
    <button class="modal-del" id="modal-del" onclick="deleteLine()" style="display:none">Supprimer</button>
  </div>
</div>

<script>
var B = null, tab = 's', portTab = 'positions', section = 'brief';
var favorites = JSON.parse(localStorage.getItem('mb_favorites') || '[]');
var githubToken = localStorage.getItem('mb_gh_token') || '';
var gcalApiKey = localStorage.getItem('mb_gcal_key') || '';
var gcalId = localStorage.getItem('mb_gcal_id') || '';
var gcalId2 = localStorage.getItem('mb_gcal_id2') || '';
var agendaEvents = null;

// Date
var d = new Date();
var DAYS   = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
var MONTHS = ['janvier','fevrier','mars','avril','mai','juin','juillet','aout','septembre','octobre','novembre','decembre'];
document.getElementById('hdate').textContent = DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();

// ── SECTION SWITCH ──
function switchSection(el, s) {
  document.querySelectorAll('.section-tab').forEach(function(x){x.classList.remove('on')});
  el.classList.add('on');
  section = s;
  document.getElementById('brief-tabs').style.display = s === 'brief' ? 'flex' : 'none';
  document.getElementById('port-tabs').style.display  = s === 'portfolio' ? 'flex' : 'none';
  if (s === 'brief') renderBrief(tab);
  else renderPortfolio(portTab);
}

// ── BRIEF TABS ──
function sw(el, t) {
  document.querySelectorAll('#brief-tabs .ctab').forEach(function(x){x.classList.remove('on')});
  el.classList.add('on'); tab = t;
  B ? renderBrief(t) : showSkel();
}

// ── PORTFOLIO TABS ──
function swPort(el, t) {
  document.querySelectorAll('#port-tabs .ctab').forEach(function(x){x.classList.remove('on')});
  el.classList.add('on'); portTab = t;
  renderPortfolio(t);
}

function showSkel() {
  var html = '';
  for (var i = 0; i < 5; i++) {

// ── OAT CURVE ──
function renderOatCurve(curve) {
  if (!curve || !curve.length) return '';
  var valid = curve.filter(function(p){ return p.rate !== null; });
  var svgHtml = '';
  if (valid.length >= 2) {
    var rates = valid.map(function(p){ return p.rate; });
    var minR = Math.min.apply(null, rates) - 0.1;
    var maxR = Math.max.apply(null, rates) + 0.1;
    var W = 300, H = 80, pad = 12;
    var pts = valid.map(function(p,i) {
      var x = pad + (i/(valid.length-1))*(W-pad*2);
      var y = H - pad - ((p.rate-minR)/(maxR-minR))*(H-pad*2);
      return x.toFixed(1)+','+y.toFixed(1);
    }).join(' ');
    svgHtml = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:80px">' +
      '<polyline points="' + pts + '" fill="none" stroke="#b5602a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
      valid.map(function(p,i){
        var x = pad + (i/(valid.length-1))*(W-pad*2);
        var y = H - pad - ((p.rate-minR)/(maxR-minR))*(H-pad*2);
        return '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="3" fill="#b5602a"/>';
      }).join('') + '</svg>';
  }
  var curveDate = '';
  curve.forEach(function(p){ if (p.date && !curveDate) curveDate = p.date; });
  var items = curve.map(function(p) {
    var arrow = p.trend === 'up' ? '<span style="color:#c0392b">&#9650;</span>' : p.trend === 'down' ? '<span style="color:#2d6e45">&#9660;</span>' : '<span style="color:#7a7570">&#9644;</span>';
    var diff = (p.diff !== null && p.diff !== undefined) ? ((p.diff > 0 ? '+' : '') + p.diff.toFixed(3)) : '';
    return '<div class="curve-item">' +
      '<div class="curve-mat">' + p.maturity + '</div>' +
      '<div class="curve-rate">' + (p.rate !== null ? p.rate.toFixed(2) + '%' : '-') + '</div>' +
      '<div class="curve-trend">' + arrow + '</div>' +
      '<div class="curve-diff">' + diff + '</div>' +
      '</div>';
  }).join('');
  return '<div class="curve-wrap">' +
    '<div class="sec-rule" style="padding:0 0 8px;margin-bottom:12px">Courbe OAT France</div>' +
    '<div class="curve-box">' +
    (curveDate ? '<div class="curve-date">BCE : ' + curveDate + '</div>' : '') +
    svgHtml +
    '<div class="curve-grid">' + items + '</div>' +
    '</div></div>';
}

// ── STOOQ QUOTE ──
function fetchStooq(sym, callback) {
  var url = 'https://stooq.com/q/l/?s=' + sym + '&f=sd2t2ohlcv&h&e=csv';
  fetch(url)
    .then(function(r){ return r.text(); })
    .then(function(text){
      var lines = text.trim().split('\n');
      if (lines.length < 2) { callback(null); return; }
      var vals = lines[1].split(',');
      var close = parseFloat(vals[4]);
      var open  = parseFloat(vals[3]);
      if (!close || close <= 0) { callback(null); return; }
      var pct = (close - open) / open * 100;
      callback({close: close, open: open, pct: pct});
    })
    .catch(function(){ callback(null); });
}

function fmt(v, dec, suffix) {
  if (v === null || v === undefined || isNaN(v)) return '-';
  dec = dec || 2; suffix = suffix || '';
  var s = Math.abs(v).toFixed(dec);
  // Add thousand separators
  s = s.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (v < 0 ? '-' : '') + s + suffix;
}
function fmtEur(v) { return fmt(v, 2, ' €'); }
function fmtPct(v) { if (!v && v !== 0) return '-'; return (v >= 0 ? '+' : '') + fmt(v, 2, '%'); }
function dirClass(v) { return v > 0.05 ? 'up' : v < -0.05 ? 'dn' : 'fl'; }

// ── YAHOO FINANCE LIVE QUOTES ──
async function fetchYahoo(tickers) {
  if (!tickers.length) return {};
  var syms = tickers.join(',');
  // Yahoo Finance v7 - works from browser
  var url = 'https://query1.finance.yahoo.com/v7/finance/quote?symbols=' + encodeURIComponent(syms) +
    '&fields=regularMarketPrice,regularMarketPreviousClose,regularMarketChange,regularMarketChangePercent,shortName,currency,regularMarketOpen';
  try {
    var r = await fetch(url, {headers:{'User-Agent':'Mozilla/5.0'}});
    if (!r.ok) throw new Error('HTTP '+r.status);
    var data = await r.json();
    var result = {};
    (data.quoteResponse.result || []).forEach(function(q) {
      result[q.symbol] = {
        price:     q.regularMarketPrice,
        prevClose: q.regularMarketPreviousClose,
        change:    q.regularMarketChange,
        changePct: q.regularMarketChangePercent,
        name:      q.shortName || q.symbol,
        currency:  q.currency || 'EUR',
        open:      q.regularMarketOpen
      };
    });
    return result;
  } catch(e) {
    console.log('Yahoo error:', e.message);
    return {};
  }
}

async function loadLiveData() {
  var tickers = portfolio.map(function(l){ return l.ticker; });
  if (!tickers.length) return;
  var data = await fetchYahoo(tickers);
  // Save live prices for later use
  Object.assign(liveData, data);
  // Update lastPrice in portfolio
  portfolio.forEach(function(line) {
    if (liveData[line.ticker]) {
      line.lastPrice = liveData[line.ticker].price;
      line.lastUpdate = new Date().toISOString();
    }
  });
  localStorage.setItem('mb_portfolio', JSON.stringify(portfolio));
}

// ── PORTFOLIO CALCULATIONS ──
function calcPortfolio() {
  var totalValue = 0, totalCost = 0, totalDayPL = 0;
  portfolio.forEach(function(line) {
    var d = liveData[line.ticker];
    var price = d ? d.price : (line.lastPrice || line.pru);
    totalValue += line.qty * price;
    totalCost  += line.qty * line.pru;
    if (d) totalDayPL += line.qty * (d.price - d.prevClose);
  });
  return {
    totalValue: totalValue,
    totalCost:  totalCost,
    totalPL:    totalValue - totalCost,
    plPct:      totalCost > 0 ? (totalValue - totalCost) / totalCost * 100 : 0,
    totalDayPL: totalDayPL,
    dayPct:     totalCost > 0 ? totalDayPL / totalValue * 100 : 0
  };
}

        var line = item.line, idx = item.idx;
        var d = liveData[line.ticker];
        var price = d ? d.price : (line.lastPrice || 0);
        var value = price > 0 ? line.qty * price : 0;
        var plAbs = price > 0 ? (price - line.pru) * line.qty : 0;
        var plPct2 = line.pru > 0 ? (price - line.pru) / line.pru * 100 : 0;
        var dayPl  = d ? d.changePct : null;
        var dayAbs = d ? d.change * line.qty : 0;
        var plColor2 = plPct2 >= 0 ? 'var(--green)' : 'var(--red)';
        var dayColor2 = (dayPl||0) >= 0 ? 'var(--green)' : 'var(--red)';
        var alertBadge = dayPl !== null && Math.abs(dayPl) > 3 ? '<span class="alert-badge">' + (dayPl>0?'↑':'↓') + Math.abs(dayPl).toFixed(1) + '%</span>' : '';

        html += '<div class="port-line" onclick="openModal(' + idx + ')">' +
          '<div class="pl-left">' +
          '<div class="pl-icon">' + (line.ticker.replace('.PA','').substring(0,3)) + '</div>' +
          '<div class="pl-info">' +
          '<div class="pl-ticker">' + (line.name||line.ticker) + ' ' + alertBadge + '</div>' +
          '<div class="pl-name">' + line.ticker + ' · ' + (line.sector||'') + '</div>' +
          '<div class="pl-qty-pru">' + line.qty + ' titres · PRU ' + fmt(line.pru,2,' €') + '</div>' +
          '</div></div>' +
          '<div class="pl-right">' +
          '<div class="pl-price">' + (price>0 ? fmt(price,2,' €') : '-') + '</div>' +
          (d ? '<div class="pl-day ' + dirClass(dayPl) + '">' + fmtPct(dayPl) + ' (' + (dayAbs>=0?'+':'') + fmtEur(dayAbs) + ')</div>' : '') +
          '<div class="pl-total">' + (value>0?fmtEur(value):'-') + '</div>' +
          '<div class="pl-pl" style="color:' + plColor2 + '">' + fmtPct(plPct2) + ' (' + (plAbs>=0?'+':'') + fmtEur(plAbs) + ')</div>' +
          '</div></div>';
      });
    });

    // Last update
    var anyUpdate = portfolio.find(function(l){ return l.lastUpdate; });
    if (anyUpdate) {
      var dt = new Date(anyUpdate.lastUpdate);
      html += '<div style="text-align:center;padding:12px;font-size:10px;color:var(--muted)">Cours mis a jour a ' + pad2(dt.getHours()) + ':' + pad2(dt.getMinutes()) + '</div>';
    }
    html += '</div>';
    el.innerHTML = html;
  }

  else if (t === 'analyse') {
    var html = '<div class="port-wrap"><div class="analyse-wrap">';
    var calc2 = calcPortfolio();

    // KPIs
    var bestLine = null, worstLine = null;
    portfolio.forEach(function(line) {
      var d = liveData[line.ticker];
      var p = d ? d.price : (line.lastPrice || line.pru);
      var pl = line.pru > 0 ? (p - line.pru)/line.pru*100 : 0;
      if (!bestLine || pl > bestLine.pl) bestLine = {name:line.name||line.ticker, pl:pl};
      if (!worstLine || pl < worstLine.pl) worstLine = {name:line.name||line.ticker, pl:pl};
    });

    html += '<div class="kpi-grid">' +
      '<div class="kpi"><div class="kpi-label">P&L Total</div><div class="kpi-val ' + dirClass(calc2.plPct) + '">' + fmtPct(calc2.plPct) + '</div><div class="kpi-sub">' + (calc2.totalPL>=0?'+':'') + fmtEur(calc2.totalPL) + '</div></div>' +
      '<div class="kpi"><div class="kpi-label">Perf du jour</div><div class="kpi-val ' + dirClass(calc2.dayPct) + '">' + fmtPct(calc2.dayPct) + '</div><div class="kpi-sub">' + (calc2.totalDayPL>=0?'+':'') + fmtEur(calc2.totalDayPL) + '</div></div>' +
      '<div class="kpi"><div class="kpi-label">Meilleure ligne</div><div class="kpi-val up">' + (bestLine?bestLine.name:'-') + '</div><div class="kpi-sub">' + (bestLine?fmtPct(bestLine.pl):'-') + '</div></div>' +
      '<div class="kpi"><div class="kpi-label">A surveiller</div><div class="kpi-val dn">' + (worstLine?worstLine.name:'-') + '</div><div class="kpi-sub">' + (worstLine?fmtPct(worstLine.pl):'-') + '</div></div>' +
      '</div>';

    // Sectoral allocation pie
    var sectorTotals = {};
    portfolio.forEach(function(line) {
      var d = liveData[line.ticker];
      var p = d ? d.price : (line.lastPrice || line.pru);
      var v = line.qty * p;
      var s = line.sector || 'Autre';
      sectorTotals[s] = (sectorTotals[s]||0) + v;
    });
    var totalV = calc2.totalValue || 1;
    var sectors = Object.keys(sectorTotals).sort(function(a,b){ return sectorTotals[b]-sectorTotals[a]; });
    if (sectors.length > 0) {
      var W=140, H=140, cx=70, cy=70, r=60, ri=35;
      var startAngle = -Math.PI/2;
      var slices = '';
      sectors.forEach(function(s, i) {
        var pct = sectorTotals[s]/totalV;
        var angle = pct * Math.PI * 2;
        var x1 = cx + r*Math.cos(startAngle), y1 = cy + r*Math.sin(startAngle);
        var x2 = cx + r*Math.cos(startAngle+angle), y2 = cy + r*Math.sin(startAngle+angle);
        var xi1 = cx + ri*Math.cos(startAngle), yi1 = cy + ri*Math.sin(startAngle);
        var xi2 = cx + ri*Math.cos(startAngle+angle), yi2 = cy + ri*Math.sin(startAngle+angle);
        var large = angle > Math.PI ? 1 : 0;
        var color = SECTOR_COLORS[s] || '#95a5a6';
        slices += '<path d="M'+xi1.toFixed(1)+' '+yi1.toFixed(1)+' L'+x1.toFixed(1)+' '+y1.toFixed(1)+' A'+r+' '+r+' 0 '+large+' 1 '+x2.toFixed(1)+' '+y2.toFixed(1)+' L'+xi2.toFixed(1)+' '+yi2.toFixed(1)+' A'+ri+' '+ri+' 0 '+large+' 0 '+xi1.toFixed(1)+' '+yi1.toFixed(1)+' Z" fill="'+color+'"/>';
        startAngle += angle;
      });
      var legendItems = sectors.map(function(s) {
        var color = SECTOR_COLORS[s]||'#95a5a6';
        var pct = sectorTotals[s]/totalV*100;
        return '<div class="pie-item"><div class="pie-dot" style="background:'+color+'"></div><div class="pie-item-label">'+s+'</div><div class="pie-item-pct">'+pct.toFixed(1)+'%</div></div>';
      }).join('');
      html += '<div class="pie-wrap"><div class="pie-title">Allocation sectorielle</div><div class="pie-inner">' +
        '<svg viewBox="0 0 140 140" style="width:140px;height:140px;flex-shrink:0">'+slices+'<circle cx="70" cy="70" r="28" fill="var(--surface)"/></svg>' +
        '<div class="pie-legend">'+legendItems+'</div></div></div>';
    }

    // Performance table
    html += '<div class="perf-table">' +
      '<div class="perf-header"><div class="perf-header-cell" style="text-align:left">Valeur</div><div class="perf-header-cell">Cours</div><div class="perf-header-cell">Jour</div><div class="perf-header-cell">PRU</div></div>';
    portfolio.forEach(function(line) {
      var d = liveData[line.ticker];
      var p = d ? d.price : (line.lastPrice || 0);
      var plLine = line.pru>0 ? (p-line.pru)/line.pru*100 : 0;
      var dayPl2 = d ? d.changePct : null;
      html += '<div class="perf-row">' +
        '<div class="perf-name">' + (line.name||line.ticker) + '</div>' +
        '<div class="perf-cell">' + (p>0?fmt(p,2,' €'):'-') + '</div>' +
        '<div class="perf-cell ' + (dayPl2!==null?dirClass(dayPl2):'fl') + '">' + (dayPl2!==null?fmtPct(dayPl2):'-') + '</div>' +
        '<div class="perf-cell ' + dirClass(plLine) + '">' + fmtPct(plLine) + '</div>' +
        '</div>';
    });
    html += '</div>';

    // Concentration risk
    var sorted = portfolio.map(function(line) {
      var d = liveData[line.ticker]; var p = d?d.price:(line.lastPrice||line.pru);
      return {name:line.name||line.ticker, value:line.qty*p};
    }).sort(function(a,b){return b.value-a.value;});
    if (sorted.length > 0) {
      html += '<div class="pie-wrap"><div class="pie-title">Concentration</div>';
      sorted.forEach(function(item) {
        var pct = totalV>0?item.value/totalV*100:0;
        var color = pct>40?'var(--red)':pct>25?'var(--accent)':'var(--green)';
        html += '<div class="risk-bar-wrap"><div class="risk-bar-label"><span class="risk-bar-name">'+item.name+'</span><span class="risk-bar-val">'+pct.toFixed(1)+'%</span></div>' +
          '<div class="risk-bar-track"><div class="risk-bar-fill" style="width:'+Math.min(pct,100)+'%;background:'+color+'"></div></div></div>';
      });
      html += '</div>';
    }

    // Related news
    if (B) {
      var names = portfolio.map(function(l){ return (l.name||'').toLowerCase(); }).filter(function(n){return n.length>3;});
      var related = [];
      ['marches','entreprises','ma'].forEach(function(key) {
        (B[key]&&B[key].articles?B[key].articles:[]).forEach(function(a) {
          var t2 = (a.titre||'').toLowerCase();
          if (names.some(function(n){return t2.indexOf(n)>=0;})) related.push(a);
        });
      });
      if (related.length) {
        html += '<div class="art-rule">Actualites liees a votre portefeuille</div>';
        related.slice(0,5).forEach(function(a){ html += artCard(a); });
      }
    }

    html += '</div></div>';
    el.innerHTML = html;
  }

  else if (t === 'settings') {
    el.innerHTML = '<div class="port-wrap"><div class="settings-wrap">' +
      '<div class="sec-rule" style="padding:0 0 8px;margin-bottom:4px">Portefeuille</div>' +
      '<div class="settings-label">Token GitHub (sauvegarde)</div>' +
      '<input class="settings-input" type="password" id="gh-token" value="' + githubToken + '" placeholder="ghp_..." autocomplete="off">' +
      '<div class="settings-note">Permet de sauvegarder votre portefeuille dans GitHub en cas de changement de telephone.</div>' +
      '<button class="settings-save" onclick="saveSettings()">Enregistrer</button>' +
      '<div style="margin-top:24px">' +
      '<div class="settings-label">Export / Import</div>' +
      '<button class="btn-secondary" style="margin-top:8px;margin-right:8px" onclick="exportData()">Exporter JSON</button>' +
      '</div>' +
      '<div style="margin-top:24px">' +
      '<div class="settings-label" style="color:var(--red)">Zone danger</div>' +
      '<button class="btn-secondary" style="margin-top:8px;color:var(--red);border-color:rgba(192,57,43,.3)" onclick="clearPortfolio()">Vider le portefeuille</button>' +
      '</div>' +
      '</div></div>';
  }
}

async function refreshQuotes() {
  var btn = document.querySelector('.btn-secondary');
  if (btn) { btn.textContent = 'Chargement...'; btn.disabled = true; }
  await loadLiveData();
  renderPortfolio('positions');
}

function clearPortfolio() {
  if (confirm('Supprimer toutes les lignes ?')) {
    portfolio = []; liveData = {};
    localStorage.setItem('mb_portfolio', '[]');
    renderPortfolio('positions');
  }
}

function exportData() {
  var blob = new Blob([JSON.stringify({portfolio:portfolio}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a'); a.href=url; a.download='portfolio.json'; a.click();
}

// ── MODAL ──
function openModal(idx) {
  editIdx = idx;
  var modal = document.getElementById('modal');
  var delBtn = document.getElementById('modal-del');
  if (idx >= 0 && portfolio[idx]) {
    var line = portfolio[idx];
    document.getElementById('modal-title').textContent = 'Modifier ' + (line.name||line.ticker);
    document.getElementById('m-ticker').value  = line.ticker;
    document.getElementById('m-name').value    = line.name||'';
    document.getElementById('m-qty').value     = line.qty;
    document.getElementById('m-pru').value     = line.pru;
    document.getElementById('m-type').value    = line.type||'action';
    document.getElementById('m-sector').value  = line.sector||'Autre';
    delBtn.style.display = 'block';
  } else {
    document.getElementById('modal-title').textContent = 'Ajouter une ligne';
    ['m-ticker','m-name','m-qty','m-pru'].forEach(function(id){ document.getElementById(id).value=''; });
    document.getElementById('m-type').value   = 'action';
    document.getElementById('m-sector').value = 'Autre';
    delBtn.style.display = 'none';
  }
  modal.classList.add('open');
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }

function saveLine() {
  var ticker = (document.getElementById('m-ticker').value||'').trim().toUpperCase();
  var name   = (document.getElementById('m-name').value||'').trim();
  var qty    = parseFloat(document.getElementById('m-qty').value);
  var pru    = parseFloat(document.getElementById('m-pru').value);
  var type   = document.getElementById('m-type').value;
  var sector = document.getElementById('m-sector').value;
  if (!ticker || isNaN(qty) || isNaN(pru) || qty <= 0 || pru <= 0) {
    alert('Renseignez tous les champs obligatoires.');
    return;
  }
  var line = {ticker:ticker, name:name||ticker, qty:qty, pru:pru, type:type, sector:sector};
  if (editIdx >= 0) portfolio[editIdx] = line;
  else portfolio.push(line);
  localStorage.setItem('mb_portfolio', JSON.stringify(portfolio));
  closeModal();
  loadLiveData().then(function(){ renderPortfolio('positions'); });
}

function deleteLine() {
  if (editIdx >= 0) { portfolio.splice(editIdx, 1); localStorage.setItem('mb_portfolio', JSON.stringify(portfolio)); }
  closeModal();
  renderPortfolio('positions');
}

function pad2(n) { return n < 10 ? '0'+n : ''+n; }
function formatEuro(v) { return fmtEur(v); }
function calcPortfolioLegacy() { return calcPortfolio(); }


function formatEuro(v) {
  if (!v && v !== 0) return '-';
  return (v < 0 ? '-' : '') + Math.abs(v).toLocaleString('fr-FR', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' EUR';
}

// ── GOOGLE CALENDAR ──
function saveGcalConfig() {
  gcalApiKey = document.getElementById('gcal-key').value.trim();
  gcalId     = document.getElementById('gcal-id').value.trim();
  localStorage.setItem('mb_gcal_key', gcalApiKey);
  localStorage.setItem('mb_gcal_id',  gcalId);
  agendaEvents = null;
  renderBrief('agenda');
}

function loadAgenda() {
  if (!gcalApiKey || !gcalId) return;
  var now   = new Date();
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var end   = new Date(today.getTime() + 2 * 24 * 60 * 60 * 1000); // today + tomorrow
  var tMin  = today.toISOString();
  var tMax  = end.toISOString();
  var calId = encodeURIComponent(gcalId);
  var url   = 'https://www.googleapis.com/calendar/v3/calendars/' + calId +
              '/events?key=' + gcalApiKey +
              '&timeMin=' + encodeURIComponent(tMin) +
              '&timeMax=' + encodeURIComponent(tMax) +
              '&singleEvents=true&orderBy=startTime&maxResults=50';
  fetch(url)
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(data) {
      agendaEvents = data.items || [];
      if (tab === 'agenda') renderAgendaEvents(document.getElementById('cnt'), agendaEvents);
    })
    .catch(function(e) {
      document.getElementById('cnt').innerHTML = '<div class="empty-note">Erreur Google Calendar: ' + e.message + '<br><br><button class="btn-sec" onclick="resetGcalConfig()">Reconfigurer</button></div>';
    });
}

function resetGcalConfig() {
  gcalApiKey = ''; gcalId = '';
  localStorage.removeItem('mb_gcal_key');
  localStorage.removeItem('mb_gcal_id');
  renderBrief('agenda');
}

function renderAgendaEvents(el, events) {
  if (!events.length) {
    el.innerHTML = '<div class="agenda-day">Aujourd\'hui et demain</div><div class="agenda-empty">Aucun evenement -- vous etes libre !</div>';
    return;
  }
  var now   = new Date();
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var tomorrow = new Date(today.getTime() + 24*60*60*1000);
  var days = {
    today:    {label: "Aujourd\'hui -- " + today.getDate() + ' ' + ['jan','fev','mar','avr','mai','jun','jul','aou','sep','oct','nov','dec'][today.getMonth()], events: []},
    tomorrow: {label: "Demain — " + tomorrow.getDate() + ' ' + ['jan','fev','mar','avr','mai','jun','jul','aou','sep','oct','nov','dec'][tomorrow.getMonth()], events: []}
  };
  events.forEach(function(ev) {
    var start = ev.start.dateTime ? new Date(ev.start.dateTime) : new Date(ev.start.date);
    var d2 = new Date(start.getFullYear(), start.getMonth(), start.getDate());
    if (d2.getTime() === today.getTime()) days.today.events.push(ev);
    else days.tomorrow.events.push(ev);
  });

  var calColors = {};
  var colorIdx = 0;
  var palette = ['#b5602a','#2d6e45','#1a4a80','#8b2fc9','#c0392b','#e67e22'];

  var html = '<div style="padding:8px 0 0">';
  ['today','tomorrow'].forEach(function(dayKey) {
    var day = days[dayKey];
    html += '<div class="agenda-day">' + day.label + '</div>';
    if (!day.events.length) {
      html += '<div class="agenda-empty">Rien de prevu</div>';
      return;
    }
    day.events.forEach(function(ev) {
      var isAllDay = !!ev.start.date;
      var startDt  = ev.start.dateTime ? new Date(ev.start.dateTime) : null;
      var endDt    = ev.end.dateTime   ? new Date(ev.end.dateTime)   : null;
      var timeStr  = isAllDay ? 'Journee' : (startDt ? pad2(startDt.getHours())+':'+pad2(startDt.getMinutes()) + (endDt ? ' - '+pad2(endDt.getHours())+':'+pad2(endDt.getMinutes()) : '') : '');
      var calName  = (ev.organizer && ev.organizer.displayName) ? ev.organizer.displayName : '';
      if (!calColors[calName]) { calColors[calName] = palette[colorIdx % palette.length]; colorIdx++; }
      var color    = calColors[calName];
      var loc      = ev.location ? '<div class="agenda-loc">📍 ' + ev.location + '</div>' : '';
      var link     = 'https://calendar.google.com/calendar/r/day/' + (startDt||new Date()).getFullYear() + '/' + ((startDt||new Date()).getMonth()+1) + '/' + (startDt||new Date()).getDate();
      var past     = startDt && startDt < now ? 'opacity:.5;' : '';
      html += '<a class="agenda-event" href="' + link + '" target="_blank" style="' + past + 'display:flex;gap:12px;align-items:flex-start">' +
        '<div style="min-width:70px;flex-shrink:0">' +
        '<div style="font-size:12px;font-weight:600;color:' + color + '">' + timeStr + '</div>' +
        '</div>' +
        '<div style="flex:1">' +
        '<div class="agenda-title">' + (ev.summary || 'Sans titre') + '</div>' +
        loc +
        (ev.description ? '<div class="agenda-loc">' + ev.description.replace(/<[^>]+>/g,'').substring(0,80) + '...</div>' : '') +
        '</div></a>';
    });
  });
  html += '<div style="padding:12px 20px"><button class="btn-sec" style="font-size:10px" onclick="resetGcalConfig()">Changer de calendrier</button></div>';
  html += '</div>';
  el.innerHTML = html;
}

function pad2(n) { return n < 10 ? '0'+n : ''+n; }

// ── LOAD BRIEFING ──
function refresh() {
  document.getElementById('rbtn').disabled = true;
  document.getElementById('rbtn').textContent = '...';
  showSkel();
  fetch('briefing.json?t=' + Date.now())
    .then(function(r){ if (!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(data) {
      B = data;
      if (B.timestamp) document.getElementById('hts').textContent = B.timestamp;
      if (section === 'brief') renderBrief(tab);
    })
    .catch(function() {
      document.getElementById('cnt').innerHTML = '<div class="empty-note" style="padding:48px 20px">' +
        '<div style="font-family:\'Playfair Display\',serif;font-size:20px;margin-bottom:10px">Pas encore de briefing</div>' +
        '<div style="line-height:1.7">GitHub -> Actions -> Run workflow</div></div>';
    })
    .finally(function() {
      document.getElementById('rbtn').disabled = false;
      document.getElementById('rbtn').textContent = 'Actualiser';
    });
}

// Init
refresh();
if (portfolio.length > 0) {
  loadLiveQuotes(function() {
    if (section === 'portfolio') renderPortfolio(portTab);
  });
}
