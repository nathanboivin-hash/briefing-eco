<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Morning Brief">
<title>Morning Brief</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink:#1a1a1a; --paper:#f5f2ed; --cream:#ede9e2; --warm:#e8e2d8;
  --rule:rgba(26,26,26,0.12); --rule2:rgba(26,26,26,0.06);
  --accent:#b5602a; --muted:#7a7570; --green:#2d6e45; --red:#c0392b;
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent }
html, body { height:100%; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; font-size:15px; -webkit-font-smoothing:antialiased }
body { overflow:hidden; position:fixed; width:100% }
#app { height:100%; display:flex; flex-direction:column }

/* MASTHEAD */
.mh { background:var(--ink); flex-shrink:0; padding-top:max(env(safe-area-inset-top,44px),44px) }
.mh-inner { padding:12px 20px 0; display:flex; justify-content:space-between; align-items:flex-end }
.mh-date { font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:rgba(255,255,255,.35); margin-bottom:4px }
.mh-title { font-family:'Playfair Display',serif; font-size:28px; color:#fff; font-weight:400; line-height:1 }
.mh-title em { font-style:italic; color:#d4924e }
.mh-right { display:flex; flex-direction:column; align-items:flex-end; gap:5px; padding-bottom:2px }
.btn-ref { background:none; border:1px solid rgba(255,255,255,.25); border-radius:4px; padding:7px 14px; font-size:11px; font-weight:500; letter-spacing:.06em; text-transform:uppercase; color:rgba(255,255,255,.7); cursor:pointer; font-family:'Inter',sans-serif }
.btn-ref:disabled { opacity:.3 }
.mh-ts { font-size:10px; color:rgba(255,255,255,.25); letter-spacing:.04em }

/* TABS */
.tabs { background:var(--ink); border-bottom:1px solid rgba(255,255,255,.08); display:flex; overflow-x:auto; padding:0 20px; margin-top:10px; scrollbar-width:none; flex-shrink:0 }
.tabs::-webkit-scrollbar { display:none }
.tab { flex-shrink:0; padding:10px 14px 12px; font-size:11px; font-weight:500; letter-spacing:.08em; text-transform:uppercase; color:rgba(255,255,255,.3); border:none; border-bottom:2px solid transparent; background:none; cursor:pointer; white-space:nowrap; font-family:'Inter',sans-serif }
.tab.on { color:#fff; border-bottom-color:#d4924e }

/* CONTENT */
.cnt { flex:1; overflow-y:auto; background:var(--paper); -webkit-overflow-scrolling:touch; padding-bottom:max(env(safe-area-inset-bottom,16px),32px) }

/* SKELETON */
.sk { background:linear-gradient(90deg,var(--cream) 25%,var(--warm) 50%,var(--cream) 75%); background-size:200% 100%; animation:sh 1.3s infinite; border-radius:2px }
@keyframes sh { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
.sk-item { border-bottom:1px solid var(--rule2); padding:16px 20px }

/* ALERT */
.alert-bar { margin:14px 20px 0; background:#fff3e0; border-left:3px solid var(--accent); padding:10px 14px; font-size:12px; color:#7a3a10; line-height:1.6; border-radius:0 4px 4px 0 }

/* SUMMARY */
.sum-block { padding:18px 20px 0 }
.sum-text { font-family:'Playfair Display',serif; font-size:16px; line-height:1.8; color:#2a2520; border-bottom:1px solid var(--rule); padding-bottom:16px }
.sec-rule { font-size:10px; font-weight:500; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--rule); padding:16px 20px 8px }
.pt-item { border-bottom:1px solid var(--rule2); padding:13px 20px }
.pt-label { font-size:10px; font-weight:500; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); margin-bottom:3px }
.pt-title { font-family:'Playfair Display',serif; font-size:14px; color:var(--ink); margin-bottom:4px }
.pt-body { font-size:12px; color:var(--muted); line-height:1.65 }
.ts-line { text-align:center; font-size:10px; color:rgba(26,26,26,.2); letter-spacing:.08em; padding:14px 20px }

/* METRICS */
.met-sec { padding:14px 20px 0 }
.met-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-bottom:4px }
.met { background:#fff; border:1px solid var(--rule); border-radius:6px; padding:12px 13px }
.met-label { font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:4px }
.met-row { display:flex; justify-content:space-between; align-items:baseline }
.met-val { font-family:'Playfair Display',serif; font-size:18px; font-weight:600; color:var(--ink) }
.met-chg { font-size:12px; font-weight:500 }
.met-sub { font-size:10px; color:var(--muted); margin-top:3px }
.up { color:var(--green) } .dn { color:var(--red) } .fl { color:var(--muted) }

/* ARTICLES */
.art-rule { font-size:10px; font-weight:500; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--rule); padding:16px 20px 8px }
.art { display:block; color:inherit; text-decoration:none; border-bottom:1px solid var(--rule2); padding:13px 20px }
a.art:active { background:var(--cream) }
.art-meta { display:flex; align-items:center; gap:6px; margin-bottom:6px; flex-wrap:wrap }
.badge { font-size:9px; font-weight:500; letter-spacing:.07em; text-transform:uppercase; padding:2px 8px; border-radius:2px }
.b-ec  { background:rgba(181,96,42,0.12); color:#7a3a10 }
.b-fi  { background:rgba(20,60,150,0.1);  color:#1a3a80 }
.b-bfm { background:rgba(30,100,200,0.1); color:#1a50a0 }
.b-lt  { background:rgba(80,40,140,0.1);  color:#4a2080 }
.b-ch  { background:rgba(40,120,60,0.1);  color:#206030 }
.b-lm  { background:rgba(0,0,0,0.08);     color:#444 }
.b-re  { background:rgba(200,60,30,0.1);  color:#a03020 }
.b-ag  { background:rgba(0,100,80,0.1);   color:#006050 }
.b-def { background:rgba(0,0,0,0.06);     color:#555 }
.art-time { font-size:10px; color:var(--muted) }
.art-title { font-family:'Playfair Display',serif; font-size:15px; line-height:1.45; color:var(--ink); margin-bottom:5px }
.art-body { font-size:12px; color:var(--muted); line-height:1.65 }
.art-cta { font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); margin-top:7px; font-weight:500 }
.empty-note { padding:32px 20px; text-align:center; font-size:13px; color:var(--muted) }
</style>
</head>
<body>
<div id="app">
  <div class="mh">
    <div class="mh-inner">
      <div>
        <div class="mh-date" id="hdate"></div>
        <div class="mh-title">Morning <em>Brief</em></div>
      </div>
      <div class="mh-right">
        <button class="btn-ref" id="rbtn" onclick="load()">Actualiser</button>
        <div class="mh-ts" id="hts"></div>
      </div>
    </div>
    <div class="tabs">
      <button class="tab on"  onclick="sw(this,'s')">Synthese</button>
      <button class="tab"     onclick="sw(this,'m')">Marches</button>
      <button class="tab"     onclick="sw(this,'e')">Entreprises</button>
      <button class="tab"     onclick="sw(this,'a')">M&amp;A</button>
      <button class="tab"     onclick="sw(this,'k')">Macro</button>
      <button class="tab"     onclick="sw(this,'p')">Politique</button>
    </div>
  </div>
  <div class="cnt" id="cnt"></div>
</div>
<script>
var B = null, tab = 's';

// Date header
var d = new Date();
var DAYS = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
var MONTHS = ['janvier','fevrier','mars','avril','mai','juin','juillet','aout','septembre','octobre','novembre','decembre'];
document.getElementById('hdate').textContent = DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();

function sw(el, t) {
  var tabs = document.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('on');
  el.classList.add('on');
  tab = t;
  B ? render(t) : showSkel();
}

function showSkel() {
  var html = '';
  for (var i = 0; i < 5; i++) {
    html += '<div class="sk-item">' +
      '<div class="sk" style="height:10px;width:55px;border-radius:20px;margin-bottom:10px"></div>' +
      '<div class="sk" style="height:15px;width:88%;margin-bottom:8px"></div>' +
      '<div class="sk" style="height:15px;width:65%;margin-bottom:10px"></div>' +
      '<div class="sk" style="height:12px;width:100%;margin-bottom:5px"></div>' +
      '<div class="sk" style="height:12px;width:72%"></div>' +
      '</div>';
  }
  document.getElementById('cnt').innerHTML = html;
}

function badge(src) {
  var s = (src || '').toLowerCase();
  if (s.indexOf('echos') >= 0 || s.indexOf('echos') >= 0) return '<span class="badge b-ec">Les Echos</span>';
  if (s.indexOf('figaro') >= 0)  return '<span class="badge b-fi">Le Figaro</span>';
  if (s.indexOf('bfm') >= 0)     return '<span class="badge b-bfm">BFM Business</span>';
  if (s.indexOf('tribune') >= 0) return '<span class="badge b-lt">La Tribune</span>';
  if (s.indexOf('challenges') >= 0) return '<span class="badge b-ch">Challenges</span>';
  if (s.indexOf('monde') >= 0)   return '<span class="badge b-lm">Le Monde</span>';
  if (s.indexOf('reuters') >= 0) return '<span class="badge b-re">Reuters</span>';
  if (s.indexOf('agefi') >= 0)   return '<span class="badge b-ag">L\'Agefi</span>';
  if (s.indexOf('boursorama') >= 0) return '<span class="badge b-def">Boursorama</span>';
  if (s.indexOf('capital') >= 0) return '<span class="badge b-def">Capital</span>';
  if (s.indexOf('politico') >= 0) return '<span class="badge b-def">Politico</span>';
  return '<span class="badge b-def">' + (src || 'Web') + '</span>';
}

function artCard(a) {
  var url = (a.url && a.url.indexOf('http') === 0) ? a.url : null;
  var tag = url ? 'a' : 'div';
  var attr = url ? ' href="' + url + '" target="_blank"' : '';
  var cta = url ? '<div class="art-cta">Lire &rarr;</div>' : '';
  var body = a.resume ? '<div class="art-body">' + a.resume + '</div>' : '';
  return '<' + tag + ' class="art"' + attr + '>' +
    '<div class="art-meta">' + badge(a.source) + '<span class="art-time">' + (a.heure || '') + '</span></div>' +
    '<div class="art-title">' + (a.titre || '') + '</div>' +
    body + cta +
    '</' + tag + '>';
}

function artList(key) {
  var list = B[key] && B[key].articles ? B[key].articles : [];
  if (!list.length) return '<div class="empty-note">Aucun article disponible</div>';
  var html = '';
  for (var i = 0; i < list.length; i++) html += artCard(list[i]);
  return html;
}

function metCard(m) {
  var dir = m.dir === 'up' ? 'up' : m.dir === 'down' ? 'dn' : 'fl';
  return '<div class="met">' +
    '<div class="met-label">' + m.label + '</div>' +
    '<div class="met-row">' +
    '<div class="met-val">' + m.value + '</div>' +
    '<div class="met-chg ' + dir + '">' + m.change + '</div>' +
    '</div>' +
    '</div>';
}

function render(t) {
  var el = document.getElementById('cnt');
  if (!B) { showSkel(); return; }

  if (t === 's') {
    var alert = B.alerte ? '<div class="alert-bar">' + B.alerte + '</div>' : '';
    var pts = '';
    var points = B.synthese && B.synthese.points ? B.synthese.points : [];
    for (var i = 0; i < points.length; i++) {
      var p = points[i];
      var parts = (p.titre || '').split('—');
      var lbl = parts[0] ? parts[0].trim() : '';
      var rest = parts[1] ? parts[1].trim() : (p.titre || '');
      pts += '<div class="pt-item">' +
        '<div class="pt-label">' + lbl + '</div>' +
        '<div class="pt-title">' + rest + '</div>' +
        '<div class="pt-body">' + (p.detail || '') + '</div>' +
        '</div>';
    }
    el.innerHTML = alert +
      '<div class="sum-block"><div class="sum-text">' + (B.synthese && B.synthese.resume ? B.synthese.resume : '') + '</div></div>' +
      '<div class="sec-rule">Points cles</div>' + pts +
      '<div class="ts-line">Genere le ' + (B.timestamp || '') + '</div>';
  }
  else if (t === 'm') {
    var metrics = B.marches && B.marches.metrics ? B.marches.metrics : [];
    var mx = '';
    for (var i = 0; i < metrics.length; i++) mx += metCard(metrics[i]);
    var arts = artList('marches');
    el.innerHTML =
      '<div class="met-sec"><div class="sec-rule" style="padding:0 0 8px;margin-bottom:8px">Indices et taux du jour</div>' +
      '<div class="met-grid">' + mx + '</div></div>' +
      '<div class="art-rule">Actualites marches</div>' + arts;
  }
  else {
    var cfg = {
      e: {key:'entreprises', label:'Resultats et vie des entreprises'},
      a: {key:'ma',          label:'Fusions, acquisitions et PE'},
      k: {key:'macro',       label:'Macroeconomie France et Europe'},
      p: {key:'politique',   label:'Politique economique et geopolitique'}
    };
    var c = cfg[t];
    el.innerHTML = '<div class="art-rule">' + c.label + '</div>' + artList(c.key);
  }
}

function load() {
  document.getElementById('rbtn').disabled = true;
  document.getElementById('rbtn').textContent = '...';
  showSkel();
  fetch('briefing.json?t=' + Date.now())
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(data) {
      B = data;
      if (B.timestamp) document.getElementById('hts').textContent = B.timestamp;
      render(tab);
    })
    .catch(function(e) {
      document.getElementById('cnt').innerHTML =
        '<div class="empty-note" style="padding:48px 20px">' +
        '<div style="font-family:\'Playfair Display\',serif;font-size:20px;margin-bottom:10px">Pas encore de briefing</div>' +
        '<div style="line-height:1.7">Le briefing est genere a 7h chaque matin.<br>GitHub &rarr; Actions &rarr; Run workflow</div>' +
        '</div>';
    })
    .finally(function() {
      document.getElementById('rbtn').disabled = false;
      document.getElementById('rbtn').textContent = 'Actualiser';
    });
}

load();
</script>
</body>
</html>
