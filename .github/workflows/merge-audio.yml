name: Merge Morning Brief Audio

on:
  workflow_dispatch:
  push:
    paths:
      - "morning-brief-*.mp3"

jobs:

  merge-audio:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4


    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg


    - name: Create file list
      run: |
        rm -f files.txt
        
        for f in $(ls morning-brief-*.mp3 | sort -V); do
          echo "file '$f'" >> files.txt
        done
        
        echo "Liste des fichiers utilisés :"
        cat files.txt


    - name: Merge MP3 files
      run: |
        ffmpeg \
        -f concat \
        -safe 0 \
        -i files.txt \
        -c:a libmp3lame \
        -b:a 128k \
        morning-brief.mp3


    - name: Check output
      run: |
        ls -lh morning-brief.mp3
        
        ffprobe \
        -i morning-brief.mp3 \
        -show_entries format=duration \
        -v quiet \
        -of csv="p=0"


    - name: Commit merged audio
      run: |

        git config user.name "github-actions"

        git config user.email "actions@github.com"

        git add morning-brief.mp3

        git commit -m "Update Morning Brief MP3" || exit 0

        git push
