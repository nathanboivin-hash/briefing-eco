name: Merge Morning Brief Audio

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - "morning-brief-*.mp3"


jobs:

  merge-audio:

    runs-on: ubuntu-latest


    steps:

    - name: Checkout repository
      uses: actions/checkout@v4


    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg


    - name: Create file list
      run: |
        rm -f files.txt

        for f in $(ls morning-brief-*.mp3 | sort -V); do
          echo "file '$f'" >> files.txt
        done

        echo "Liste utilisée :"
        cat files.txt


    - name: Inspect files
      run: |
        echo "Fichiers MP3 présents :"
        ls -lh morning-brief-*.mp3

        echo "Durées :"

        for f in morning-brief-*.mp3; do
          echo "---- $f ----"
          ffprobe -i "$f" \
          -show_entries format=duration \
          -v quiet \
          -of csv="p=0"
        done


    - name: Merge MP3
      run: |
        ffmpeg \
        -f concat \
        -safe 0 \
        -i files.txt \
        -c:a libmp3lame \
        -b:a 128k \
        -y \
        morning-brief.mp3


    - name: Verify output
      run: |
        echo "Fichier final :"

        ls -lh morning-brief.mp3

        echo "Durée finale :"

        ffprobe \
        -i morning-brief.mp3 \
        -show_entries format=duration \
        -v quiet \
        -of csv="p=0"


    - name: Publish file
      run: |

        echo "Etat Git avant commit :"

        git status


        git add morning-brief.mp3


        echo "Etat Git après ajout :"

        git status


        git config user.name "github-actions[bot]"

        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


        git commit -m "Update morning brief audio" || echo "Aucun changement"


        git push origin HEAD
