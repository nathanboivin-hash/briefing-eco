name: Merge Morning Brief Audio

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - "morning-brief-*.mp3"


jobs:

  merge-audio:

    runs-on: ubuntu-latest


    steps:

    - name: Checkout repository
      uses: actions/checkout@v4


    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg


    - name: Create file list
      run: |
        rm -f files.txt

        for f in $(ls morning-brief-*.mp3 | sort -V); do
          echo "file '$f'" >> files.txt
        done

        echo "Fichiers utilisés :"
        cat files.txt


    - name: Inspect audio files
      run: |
        for f in morning-brief-*.mp3; do
          echo "---- $f ----"
          ffprobe -i "$f" \
          -show_entries format=duration \
          -v quiet \
          -of csv="p=0"
        done


    - name: Merge MP3 files
      run: |
        ffmpeg \
        -f concat \
        -safe 0 \
        -i files.txt \
        -c:a libmp3lame \
        -b:a 128k \
        morning-brief.mp3


    - name: Check final MP3
      run: |
        ls -lh morning-brief.mp3

        echo "Durée finale :"

        ffprobe \
        -i morning-brief.mp3 \
        -show_entries format=duration \
        -v quiet \
        -of csv="p=0"


    - name: Commit merged audio
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      run: |

        git config user.name "github-actions[bot]"

        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


        git add morning-brief.mp3


        git commit \
        -m "Update Morning Brief MP3" || echo "Aucun changement"


        git push \
        https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git \
        HEAD:${{ github.ref }}
